<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="motiveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="corrGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4af37"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Background & Outer Frame -->
  <rect x="2" y="2" width="916" height="476" rx="10" fill="url(#bgGrad)" stroke="#1e283d" stroke-width="1.5"/>

  <!-- Subtle Quantitative Grid -->
  <g stroke="#162032" stroke-width="0.8">
    <line x1="30" y1="110" x2="890" y2="110"/>
    <line x1="30" y1="175" x2="890" y2="175"/>
    <line x1="30" y1="240" x2="890" y2="240"/>
    <line x1="30" y1="305" x2="890" y2="305"/>
    <line x1="30" y1="365" x2="890" y2="365"/>
    <line x1="600" y1="68" x2="600" y2="380" stroke="#1e293b" stroke-dasharray="4,4"/>
  </g>

  <!-- Title & Phase Headers -->
  <text x="460" y="32" text-anchor="middle" fill="#f3e5ab" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" letter-spacing="1.2">
    ARITMETIKA SIKLUS ELLIOTT WAVE (5-3) &amp; MATRIKS RASIO FIBONACCI BAKU
  </text>
  <text x="460" y="50" text-anchor="middle" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10">
    FRAKTAL PASAR: 5 GELOMBANG MOTIF IMPULSIF (1–5) + 3 GELOMBANG KOREKTIF ZIGZAG/FLAT (A–B–C)
  </text>

  <!-- Phase Banner Badges -->
  <rect x="40" y="64" width="545" height="22" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="312" y="79" text-anchor="middle" fill="#00f0ff" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">
    FASE MOTIF / IMPULSE PHASE (5-WAVE TREND: 1–2–3–4–5)
  </text>

  <rect x="612" y="64" width="268" height="22" rx="4" fill="#f43f5e" fill-opacity="0.08" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1"/>
  <text x="746" y="79" text-anchor="middle" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">
    FASE KOREKTIF / COUNTER-TREND (A–B–C)
  </text>

  <!-- Area Fills under Waves -->
  <!-- Coordinates:
       Origin (0): (60, 350)
       Wave (1):   (165, 250)
       Wave (2):   (240, 312)
       Wave (3):   (405, 130)
       Wave (4):   (485, 200)
       Wave (5):   (585, 102)
       Wave (A):   (675, 215)
       Wave (B):   (745, 148)
       Wave (C):   (845, 278)
  -->
  <polygon points="60,350 165,250 240,312 405,130 485,200 585,102 585,365 60,365" fill="url(#motiveGlow)"/>
  <polygon points="585,102 675,215 745,148 845,278 845,365 585,365" fill="url(#corrGlow)"/>

  <!-- Key Structural Fibonacci & Cardinal Rule Reference Lines -->
  <!-- Origin Baseline (Rule 1 Hard Floor) -->
  <line x1="50" y1="350" x2="295" y2="350" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="298" y="353" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">
    BATAS INVAL. W2 (ORIGIN W1: 0.000)
  </text>

  <!-- Wave 1 Peak vs Wave 4 Bottom (Rule 3 Non-Overlap Buffer) -->
  <rect x="165" y="200" width="320" height="50" fill="#10b981" fill-opacity="0.06"/>
  <line x1="165" y1="250" x2="505" y2="250" stroke="#10b981" stroke-width="1.1" stroke-dasharray="4,3"/>
  <line x1="405" y1="200" x2="505" y2="200" stroke="#d4af37" stroke-width="1.1" stroke-dasharray="3,3"/>
  <text x="330" y="244" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">
    ZONA NON-OVERLAP (RULE #3: LOW W4 &gt; PEAK W1)
  </text>

  <!-- Wave 3 Fib Extension Guide -->
  <line x1="165" y1="130" x2="405" y2="130" stroke="#00f0ff" stroke-width="0.9" stroke-dasharray="2,3" stroke-opacity="0.6"/>
  <line x1="195" y1="248" x2="195" y2="134" stroke="#00f0ff" stroke-width="1" marker-end="url(#arrowCyan)" stroke-opacity="0.75"/>
  <rect x="120" y="176" width="152" height="18" rx="3" fill="#0a0f1a" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="196" y="188" text-anchor="middle" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">
    W3 = 1.618–2.618 × W1
  </text>

  <!-- RSI Bearish Divergence Indicator Line (W3 to W5) -->
  <line x1="405" y1="116" x2="585" y2="88" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="492" y="96" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="8.5">
    Euphoria + Bearish RSI Div.
  </text>

  <!-- Main Elliott Wave Polyline: Motive (1-5) -->
  <polyline points="60,350 165,250 240,312 405,130 485,200 585,102" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Highlight Retracements (W2, W4) in Gold -->
  <line x1="165" y1="250" x2="240" y2="312" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
  <line x1="405" y1="130" x2="485" y2="200" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Elliott Wave Polyline: Corrective (A-B-C) -->
  <polyline points="585,102 675,215 745,148 845,278" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Highlight Wave B Bull Trap in Gold/Amber -->
  <line x1="675" y1="215" x2="745" y2="148" stroke="#d4af37" stroke-width="2.8" stroke-dasharray="5,3" stroke-linecap="round"/>

  <!-- PRZ Target Box at Wave C Termination -->
  <rect x="785" y="268" width="102" height="36" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="836" y="283" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">
    ZONA PRZ / BUY
  </text>
  <text x="836" y="296" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8">
    W(C) = 1.00–1.618×A
  </text>

  <!-- Wave Pivot Nodes & Number Badges -->
  <!-- Origin (0) -->
  <circle cx="60" cy="350" r="4.5" fill="#0a0f1a" stroke="#8e9bb0" stroke-width="2"/>
  <text x="45" y="354" text-anchor="end" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">(0)</text>

  <!-- Wave (1) Node -->
  <circle cx="165" cy="250" r="5" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2.5"/>
  <rect x="147" y="220" width="36" height="20" rx="10" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff" stroke-width="1.2"/>
  <text x="165" y="234" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">(1)</text>
  <text x="98" y="286" text-anchor="middle" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600">Akumulasi</text>
  <text x="98" y="298" text-anchor="middle" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="8.5">Institusional</text>

  <!-- Wave (2) Node -->
  <circle cx="240" cy="312" r="5" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5"/>
  <rect x="222" y="320" width="36" height="20" rx="10" fill="#d4af37" fill-opacity="0.2" stroke="#d4af37" stroke-width="1.2"/>
  <text x="240" y="334" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">(2)</text>
  <text x="264" y="294" text-anchor="start" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">Retracement: 0.500–0.618 W1</text>
  <text x="264" y="306" text-anchor="start" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="8.5">Koreksi Tajam (Sharp Zigzag)</text>

  <!-- Wave (3) Node -->
  <circle cx="405" cy="130" r="6" fill="#0a0f1a" stroke="#00f0ff" stroke-width="3"/>
  <rect x="385" y="98" width="40" height="22" rx="11" fill="#00f0ff" fill-opacity="0.25" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="405" y="113" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">(3)</text>
  <text x="345" y="160" text-anchor="end" fill="#00f0ff" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">Partisipasi Publik &amp; Breakout</text>
  <text x="345" y="172" text-anchor="end" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="8.5">Volume Tertinggi (Tak Pernah Terpendek)</text>

  <!-- Wave (4) Node -->
  <circle cx="485" cy="200" r="5" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5"/>
  <rect x="467" y="208" width="36" height="20" rx="10" fill="#d4af37" fill-opacity="0.2" stroke="#d4af37" stroke-width="1.2"/>
  <text x="485" y="222" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">(4)</text>
  <text x="510" y="214" text-anchor="start" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">0.382 × W3</text>
  <text x="510" y="226" text-anchor="start" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="8.5">Alternasi Flat/Sideways</text>

  <!-- Wave (5) Node -->
  <circle cx="585" cy="102" r="6" fill="#0a0f1a" stroke="#00f0ff" stroke-width="3"/>
  <rect x="565" y="70" width="40" height="22" rx="11" fill="#00f0ff" fill-opacity="0.25" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="585" y="85" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">(5)</text>
  <text x="562" y="142" text-anchor="end" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">W5 = 1.00×W1 atau</text>
  <text x="562" y="153" text-anchor="end" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600">0.618 × (W1→W3)</text>

  <!-- Wave (A) Node -->
  <circle cx="675" cy="215" r="5" fill="#0a0f1a" stroke="#f43f5e" stroke-width="2.5"/>
  <rect x="657" y="224" width="36" height="20" rx="10" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="675" y="238" text-anchor="middle" fill="#fecdd3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">(A)</text>
  <text x="646" y="182" text-anchor="end" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Distribusi Awal</text>
  <text x="646" y="193" text-anchor="end" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="8">Breakdown Struktur</text>

  <!-- Wave (B) Node -->
  <circle cx="745" cy="148" r="5" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5"/>
  <rect x="727" y="118" width="36" height="20" rx="10" fill="#d4af37" fill-opacity="0.2" stroke="#d4af37" stroke-width="1.2"/>
  <text x="745" y="132" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">(B)</text>
  <text x="770" y="128" text-anchor="start" fill="#f3e5ab" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">Bull Trap (Reli Semu)</text>
  <text x="770" y="140" text-anchor="start" fill="#d4af37" font-family="'JetBrains Mono', monospace" font-size="8.5">Retracement: 0.500–0.618 × A</text>

  <!-- Wave (C) Node -->
  <circle cx="845" cy="278" r="5.5" fill="#0a0f1a" stroke="#10b981" stroke-width="2.5"/>
  <rect x="827" y="310" width="36" height="20" rx="10" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="845" y="324" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">(C)</text>
  <text x="795" y="232" text-anchor="end" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">Kapitulasi Final</text>
  <text x="795" y="244" text-anchor="end" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="8.5">5 Sub-gelombang Turun</text>

  <!-- Bottom Callout Panel: 3 Hukum Besi (Cardinal Rules) -->
  <rect x="30" y="388" width="860" height="74" rx="6" fill="#0d1526" stroke="#d4af37" stroke-opacity="0.55" stroke-width="1.2"/>
  <rect x="30" y="388" width="6" height="74" rx="3" fill="#d4af37"/>

  <text x="50" y="407" fill="#d4af37" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.9">
    TIGA HUKUM BESI ELLIOTT WAVE (NON-NEGOTIABLE CARDINAL RULES — PELANGGARAN = HITUNGAN INVALID):
  </text>

  <!-- Rule 1 -->
  <circle cx="56" cy="427" r="4" fill="#f43f5e"/>
  <text x="66" y="430" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">
    HUKUM #1 (Batas Retracement W2):
  </text>
  <text x="66" y="445" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5">
    Wave (2) TIDAK BOLEH meretrace &gt; 100%
  </text>
  <text x="66" y="456" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5">
    dari titik awal (Origin 0) Wave (1).
  </text>

  <!-- Rule 2 -->
  <circle cx="332" cy="427" r="4" fill="#00f0ff"/>
  <text x="342" y="430" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">
    HUKUM #2 (Aksioma Ekstensi W3):
  </text>
  <text x="342" y="445" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5">
    Wave (3) TIDAK PERNAH menjadi gelombang
  </text>
  <text x="342" y="456" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5">
    impuls terpendek di antara W(1), W(3), W(5).
  </text>

  <!-- Rule 3 -->
  <circle cx="618" cy="427" r="4" fill="#10b981"/>
  <text x="628" y="430" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">
    HUKUM #3 (Larangan Overlap W4–W1):
  </text>
  <text x="628" y="445" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5">
    Wave (4) TIDAK BOLEH memasuki teritori harga
  </text>
  <text x="628" y="456" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5">
    puncak Wave (1) pada pasar tunai/spot.
  </text>
</svg>