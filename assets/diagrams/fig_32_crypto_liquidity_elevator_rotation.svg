<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto">
  <defs>
    <!--  Subtle Background Grid  -->
    <pattern id="bg-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e283d" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>

    <!--  Card Surface Gradient  -->
