    </text>

    <!--  2022 Peak Label Box  -->
    <rect x="662" y="300" width="195" height="32" rx="4" fill="#131c2e" stroke="#00f0ff" stroke-width="0.8" />
    <text x="759" y="314" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00f0ff" text-anchor="middle">
