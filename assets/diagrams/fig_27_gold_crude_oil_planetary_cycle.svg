    </text>

    <!--  Pointer from Callout Box to Negative Spike  -->
    <path d="M 385 352 L 456 419" fill="none" stroke="#f43f5e" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arrowRose)" />

    <!--  3. 2022 Recovery Peak ($123.70)  -->
    <circle cx="650" cy="308" r="4.5" fill="#10b981" stroke="#0a0f1a" stroke-width="1.5" />
    
    <!--  500%+ Recovery Trajectory Arrow  -->
    <path d="M 488 412 Q 565 385 642 318" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowEmerald)" />
    
    <rect x="525" y="374" width="160" height="20" rx="4" fill="#0d2329" stroke="#10b981" stroke-width="0.9" />
    <text x="605" y="388" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">
