<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="auto">
  <defs>
    <!-- Subtle Background Grid Pattern -->
    <pattern id="bgGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e283d" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Highlighted Final Card Gradient -->
    <linearGradient id="cardGradHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2642" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Spine Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gold Arrowhead Marker -->
    <marker id="arrowGold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d4af37"/>
    </marker>

    <!-- Cyan Arrowhead Marker -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#00f0ff"/>
    </marker>
  </defs>

  <!-- Main Canvas Background -->
  <rect x="2" y="2" width="916" height="376" rx="12" fill="#0a0f1a" stroke="#1e283d" stroke-width="2"/>
  <rect x="2" y="2" width="916" height="376" rx="12" fill="url(#bgGrid)"/>

  <!-- Header Section -->
  <text x="460" y="34" text-anchor="middle" fill="#f3e5ab" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.2">
    GENEALOGI INTELEKTUAL &amp; EVOLUSI KEILMUAN ASTRONACCI (1909 – ERA MODERN)
  </text>
  <line x1="180" y1="46" x2="740" y2="46" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Horizontal Timeline Spine Track -->
  <line x1="60" y1="200" x2="860" y2="200" stroke="#1e283d" stroke-width="4" stroke-linecap="round"/>

  <!-- Glowing Arrow Connectors Between Nodes -->
  <g filter="url(#goldGlow)">
    <line x1="126" y1="200" x2="266" y2="200" stroke="#d4af37" stroke-width="2.2" marker-end="url(#arrowGold)"/>
    <line x1="298" y1="200" x2="442" y2="200" stroke="#d4af37" stroke-width="2.2" marker-end="url(#arrowGold)"/>
    <line x1="474" y1="200" x2="618" y2="200" stroke="#d4af37" stroke-width="2.2" marker-end="url(#arrowGold)"/>
  </g>
  <g filter="url(#cyanGlow)">
    <line x1="650" y1="200" x2="792" y2="200" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- ==================== NODE 1: W.D. GANN (TOP) ==================== -->
  <!-- Connector Stem -->
  <line x1="110" y1="188" x2="110" y2="160" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="110" cy="160" r="3" fill="#d4af37"/>
  <!-- Spine Milestone Node -->
  <circle cx="110" cy="200" r="11" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5" filter="url(#goldGlow)"/>
  <circle cx="110" cy="200" r="4.5" fill="#f3e5ab"/>
  <text x="110" y="226" text-anchor="middle" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">M1</text>

  <!-- Callout Card 1 -->
  <g transform="translate(22, 62)">
    <rect x="0" y="0" width="236" height="98" rx="8" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.2"/>
    <rect x="10" y="9" width="78" height="18" rx="4" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-width="0.8"/>
    <text x="49" y="21.5" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">1909–1955</text>
    <text x="224" y="21" text-anchor="end" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5">ROOT THEORY</text>
    
    <text x="12" y="43" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">W.D. Gann</text>
    <text x="12" y="61" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">The Law of Vibration, Square of 9</text>
    <text x="12" y="76" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">&amp; Time-Price Squaring</text>
    <text x="12" y="90" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9.5">(Ticker Digest 1909)</text>
  </g>

  <!-- ==================== NODE 2: GEORGE BAYER (BOTTOM) ==================== -->
  <!-- Connector Stem -->
  <line x1="282" y1="212" x2="282" y2="240" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="282" cy="240" r="3" fill="#d4af37"/>
  <!-- Spine Milestone Node -->
  <circle cx="282" cy="200" r="11" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5" filter="url(#goldGlow)"/>
  <circle cx="282" cy="200" r="4.5" fill="#f3e5ab"/>
  <text x="282" y="181" text-anchor="middle" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">M2</text>

  <!-- Callout Card 2 -->
  <g transform="translate(154, 240)">
    <rect x="0" y="0" width="248" height="96" rx="8" fill="url(#cardGrad)" stroke="#1e283d" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 240 0 Q 248 0 248 8" fill="none" stroke="#d4af37" stroke-width="2"/>
    <rect x="10" y="10" width="88" height="18" rx="4" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-width="0.8"/>
    <text x="54" y="22.5" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">1930s–1940s</text>
    <text x="236" y="22" text-anchor="end" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5">ASTRO-CYCLES</text>

    <text x="12" y="45" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">George Bayer</text>
    <text x="12" y="64" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">Time Factors &amp; Planetary Cycles</text>
    <text x="12" y="80" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">in Commodity Markets</text>
  </g>

  <!-- ==================== NODE 3: DONALD A. BRADLEY (TOP) ==================== -->
  <!-- Connector Stem -->
  <line x1="458" y1="188" x2="458" y2="160" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="458" cy="160" r="3" fill="#d4af37"/>
  <!-- Spine Milestone Node -->
  <circle cx="458" cy="200" r="11" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5" filter="url(#goldGlow)"/>
  <circle cx="458" cy="200" r="4.5" fill="#f3e5ab"/>
  <text x="458" y="226" text-anchor="middle" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">M3</text>

  <!-- Callout Card 3 -->
  <g transform="translate(334, 62)">
    <rect x="0" y="0" width="248" height="98" rx="8" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.2"/>
    <rect x="10" y="9" width="48" height="18" rx="4" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-width="0.8"/>
    <text x="34" y="21.5" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">1947</text>
    <text x="236" y="21" text-anchor="end" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5">QUANT MODEL</text>

    <text x="12" y="43" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Donald A. Bradley</text>
    <text x="12" y="62" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">The Planetary Barometer &amp;</text>
    <text x="12" y="78" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">
      Bradley Siderograph <tspan fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-weight="600">S(t)</tspan>
    </text>
  </g>

  <!-- ==================== NODE 4: MERRIMAN & PESAVENTO (BOTTOM) ==================== -->
  <!-- Connector Stem -->
  <line x1="634" y1="212" x2="634" y2="240" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="634" cy="240" r="3" fill="#d4af37"/>
  <!-- Spine Milestone Node -->
  <circle cx="634" cy="200" r="11" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5" filter="url(#goldGlow)"/>
  <circle cx="634" cy="200" r="4.5" fill="#f3e5ab"/>
  <text x="634" y="181" text-anchor="middle" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">M4</text>

  <!-- Callout Card 4 -->
  <g transform="translate(510, 240)">
    <rect x="0" y="0" width="256" height="96" rx="8" fill="url(#cardGrad)" stroke="#1e283d" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 248 0 Q 256 0 256 8" fill="none" stroke="#d4af37" stroke-width="2"/>
    <rect x="10" y="10" width="88" height="18" rx="4" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-width="0.8"/>
    <text x="54" y="22.5" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">1970s–2000s</text>
    <text x="244" y="22" text-anchor="end" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5">CONVERGENCE</text>

    <text x="12" y="45" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Merriman &amp; Pesavento</text>
    <text x="12" y="64" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">Geocosmic Fed Cycles &amp;</text>
    <text x="12" y="80" fill="#8e9bb0" font-family="'Inter', sans-serif" font-size="10.5">Fibonacci Harmonic Patterns</text>
  </g>

  <!-- ==================== NODE 5: DR. GEMA GOEYARDI (TOP - CULMINATION) ==================== -->
  <!-- Connector Stem -->
  <line x1="810" y1="186" x2="810" y2="160" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="3,3"/>
  <circle cx="810" cy="160" r="3.5" fill="#00f0ff"/>
  <!-- Spine Milestone Node (Double Ring Synthesis Node) -->
  <circle cx="810" cy="200" r="13" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2.5" filter="url(#cyanGlow)"/>
  <circle cx="810" cy="200" r="8" fill="none" stroke="#d4af37" stroke-width="1.2"/>
  <circle cx="810" cy="200" r="4" fill="#00f0ff"/>
  <text x="810" y="228" text-anchor="middle" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SYNTHESIS</text>

  <!-- Callout Card 5 -->
  <g transform="translate(640, 62)">
    <rect x="0" y="0" width="258" height="98" rx="8" fill="url(#cardGradHighlight)" stroke="#00f0ff" stroke-width="1.6"/>
    <rect x="10" y="9" width="86" height="18" rx="4" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="0.9"/>
    <text x="53" y="21.5" text-anchor="middle" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Modern Era</text>
    <text x="246" y="21" text-anchor="end" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">ASTRONACCI</text>

    <text x="12" y="43" fill="#f3e5ab" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Dr. Gema Goeyardi</text>
    <text x="12" y="61" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Sintesis Terpadu Astronacci:</text>
    <text x="12" y="79" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10">
      <tspan fill="#00f0ff" font-weight="600">Ephemeris</tspan> (When) + <tspan fill="#10b981" font-weight="600">Fibonacci</tspan> (Where)
    </text>
  </g>

  <!-- Bottom Caption / Legend Bar -->
  <g transform="translate(460, 362)">
    <text x="0" y="0" text-anchor="middle" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="0.5">
      CONTINUUM KEILMUAN: GEOMETRI WAKTU-HARGA (GANN) &#8594; SIKLUS PLANETARI (BAYER/BRADLEY) &#8594; HARMONIK FIBONACCI &#8594; SINTESIS ASTRONACCI
    </text>
  </g>
</svg>