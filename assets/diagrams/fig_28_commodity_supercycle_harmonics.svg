    <g stroke="#1e283d" stroke-width="0.75" stroke-dasharray="3,3">
      <line x1="56" y1="130" x2="430" y2="130" />
      <line x1="56" y1="185" x2="430" y2="185" />
      <line x1="56" y1="240" x2="430" y2="240" />
      <line x1="56" y1="295" x2="430" y2="295" />
      <!--  Vertical Phase Dividers  -->
