    <text x="12" y="4" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" fill="#e2e8f0" letter-spacing="0.06em">
      ANATOMI SUPERCYCLE KOMODITAS: <tspan fill="#d4af37">BACKWARDATION vs CONTANGO</tspan> &amp; SIKLUS 10–12 TAHUN
    </text>
    <text x="860" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8e9bb0" text-anchor="end">
