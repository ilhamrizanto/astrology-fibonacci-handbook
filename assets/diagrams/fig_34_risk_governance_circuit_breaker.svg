  <text x="44" y="47" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8e9bb0">INSTITUTIONAL CAPITAL PRESERVATION MATRIX // PROTOKOL KUANTITATIF RIZACORP</text>
