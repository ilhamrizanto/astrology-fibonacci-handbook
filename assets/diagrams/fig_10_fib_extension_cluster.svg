<svg viewBox="0 0 920 460" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e283d" stroke-width="0.6" opacity="0.6"/>
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e283d" stroke-width="0.3" opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="cluster-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d4af37"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8e9bb0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="916" height="456" rx="10" fill="#0a0f1a" stroke="#1e283d" stroke-width="2"/>
  <rect x="20" y="60" width="880" height="380" fill="url(#grid)"/>

  <!-- Header Bar -->
  <rect x="2" y="2" width="916" height="54" rx="10" fill="#0d1424" stroke="#1e283d" stroke-width="1"/>
  <text x="28" y="26" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.6">
    TREND-BASED FIBONACCI EXTENSION (APP) &amp; ZONA KONFLUENSI FIBONACCI CLUSTER
  </text>
  <text x="28" y="44" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8e9bb0">
    INSTITUTIONAL PRICE PROJECTION MATRIX // MULTI-TIMEFRAME HARMONIC TARGETING
  </text>
  <circle cx="888" cy="29" r="5" fill="#10b981"/>
  <text x="875" y="33" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981" text-anchor="end">LIVE MODEL</text>

  <!-- ==================== FORMULA CARD (TOP LEFT) ==================== -->
  <g transform="translate(36, 74)">
    <rect x="0" y="0" width="320" height="72" rx="6" fill="#0f172a" stroke="#1e283d" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="72" rx="2" fill="#d4af37"/>
    <text x="16" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8e9bb0" letter-spacing="0.5">
      ALTERNATE PRICE PROJECTION (APP) FORMULA
    </text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700" fill="#f3e5ab">
      P<tspan font-size="9.5" dy="3">ext</tspan><tspan dy="-3">(E) = P</tspan><tspan font-size="9.5" dy="3">C</tspan><tspan dy="-3"> + E · (P</tspan><tspan font-size="9.5" dy="3">B</tspan><tspan dy="-3"> - P</tspan><tspan font-size="9.5" dy="3">A</tspan><tspan dy="-3">)</tspan>
    </text>
    <text x="16" y="60" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#00f0ff">
      Δ(B-A) = 100.0 pts  |  E ∈ {1.000, 1.272, 1.618, 2.618}
    </text>
  </g>

  <!-- ==================== FIBONACCI EXTENSION LEVELS (FROM POINT C) ==================== -->
  <!-- Base Coordinates:
       A = (85, 395)   -> Price: 100.0
       B = (205, 295)  -> Price: 200.0 (Δ = 100px = 100 pts)
       C = (295, 357)  -> Price: 138.2 (0.618 Retracement of AB)
       Projections from C (y = 357 - E*100):
       • 1.000 = 257.0
       • 1.272 = 230.0
       • 1.618 = 195.0
       • 2.618 = 95.0
  -->

  <!-- 0.618 Retracement Reference Zone (Golden Pocket at C) -->
  <rect x="205" y="353" width="135" height="8" fill="#d4af37" opacity="0.15"/>
  <line x1="205" y1="357" x2="340" y2="357" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Level 1.000 (Equidistant AB=CD) -->
  <line x1="295" y1="257" x2="575" y2="257" stroke="#8e9bb0" stroke-width="1.2" stroke-dasharray="5,4"/>
  <rect x="580" y="246" width="295" height="22" rx="3" fill="#0f172a" stroke="#1e283d" stroke-width="1"/>
  <text x="588" y="261" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#e2e8f0">1.000 APP</text>
  <text x="662" y="261" font-family="'Inter', sans-serif" font-size="10.5" fill="#8e9bb0">Equidistant Target (AB = CD)</text>

  <!-- ==================== FIBONACCI CLUSTER CONFLUENCE BOX ==================== -->
  <!-- Spans Y=185 to Y=238 (Enclosing 1.618 APP [195], HTF 1.618 Ext [209], and 1.272 APP [230]) -->
  <rect x="375" y="183" width="510" height="56" rx="6" fill="url(#cluster-grad)" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="7,4" filter="url(#glow-rose)"/>
  
  <!-- Cluster Callout Banner -->
  <g transform="translate(385, 155)">
    <rect x="0" y="0" width="388" height="22" rx="4" fill="#f43f5e"/>
    <text x="10" y="15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#0a0f1a" letter-spacing="0.5">
      ★ FIBONACCI CLUSTER CONFLUENCE (TEMBOK LIKUIDITAS)
    </text>
  </g>
  <text x="782" y="170" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f43f5e">
    HIGH-PROBABILITY REVERSAL / SUPPLY ZONE
  </text>

  <!-- Level 1.272 (Conservative TP1) -->
  <line x1="295" y1="230" x2="575" y2="230" stroke="#10b981" stroke-width="1.3" stroke-dasharray="6,3"/>
  <text x="588" y="233" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#10b981">1.272 APP</text>
  <text x="662" y="233" font-family="'Inter', sans-serif" font-size="10.5" fill="#e2e8f0">Conservative Target (TP1)</text>

  <!-- RIGHT SIDE OVERLAY: Higher-Timeframe (HTF) External Retracement 1.618 -->
  <line x1="375" y1="212" x2="885" y2="212" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="2,3"/>
  <rect x="580" y="202" width="298" height="18" rx="3" fill="#2a121d" stroke="#f43f5e" stroke-width="0.8"/>
  <text x="588" y="215" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f43f5e">1.618 HTF EXT</text>
  <text x="682" y="215" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f3e5ab">Macro External Retracement Overlay</text>

  <!-- Level 1.618 (GOLDEN EXTENSION TARGET / TP2) -->
  <line x1="295" y1="195" x2="575" y2="195" stroke="#d4af37" stroke-width="2.2" filter="url(#glow-gold)"/>
  <text x="588" y="197" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#d4af37">1.618 APP</text>
  <text x="662" y="197" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#f3e5ab">GOLDEN EXTENSION TARGET (TP2)</text>

  <!-- Level 2.618 (Euphoria / Extended Wave 3 Target) -->
  <line x1="295" y1="95" x2="575" y2="95" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8,4" filter="url(#glow-cyan)"/>
  <rect x="580" y="83" width="305" height="24" rx="4" fill="#091e2c" stroke="#00f0ff" stroke-width="1.2"/>
  <text x="588" y="99" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00f0ff">2.618 APP</text>
  <text x="662" y="99" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0">EUPHORIA / EXTENDED WAVE 3</text>

  <!-- ==================== GEOMETRIC MEASUREMENT VECTORS ==================== -->
  <!-- Impulse Height Δ(B-A) Measurement -->
  <line x1="85" y1="395" x2="205" y2="395" stroke="#8e9bb0" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="145" y1="395" x2="145" y2="298" stroke="#8e9bb0" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-slate)"/>
  <rect x="102" y="334" width="86" height="18" rx="3" fill="#0a0f1a" stroke="#8e9bb0" stroke-width="0.8"/>
  <text x="145" y="346" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#e2e8f0" text-anchor="middle">Δ(P_B - P_A)</text>

  <!-- Clone Vector Projected from C (1.000x reference) -->
  <line x1="295" y1="357" x2="295" y2="260" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-gold)"/>
  <rect x="250" y="298" width="90" height="18" rx="3" fill="#0a0f1a" stroke="#d4af37" stroke-width="0.8"/>
  <text x="295" y="310" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#f3e5ab" text-anchor="middle">1.000 × Δ(AB)</text>

  <!-- ==================== A - B - C - D WAVE STRUCTURE ==================== -->
  <!-- Subtle Candlesticks / Market Structure Ghosting -->
  <g stroke="#1e283d" stroke-width="2" opacity="0.7">
    <line x1="115" y1="380" x2="115" y2="355"/>
    <line x1="145" y1="360" x2="145" y2="325"/>
    <line x1="175" y1="335" x2="175" y2="305"/>
    <line x1="235" y1="305" x2="235" y2="335"/>
    <line x1="265" y1="325" x2="265" y2="350"/>
    <line x1="340" y1="330" x2="340" y2="290"/>
    <line x1="385" y1="295" x2="385" y2="245"/>
    <line x1="435" y1="245" x2="435" y2="200"/>
  </g>

  <!-- Primary Wave Path: A -> B -> C -->
  <path d="M 85 395 L 205 295 L 295 357" fill="none" stroke="#d4af37" stroke-width="3" stroke-linejoin="round"/>

  <!-- Expansion Wave Path from C -> 1.618 Cluster (with Liquidity Reaction) -> 2.618 Euphoria -->
  <!-- Solid Impulse up to 1.618 TP2 Cluster -->
  <path d="M 295 357 L 365 257 L 385 268 L 455 195" fill="none" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow-gold)"/>
  
  <!-- Reaction Pullback inside Liquidity Wall & Breakout to 2.618 -->
  <path d="M 455 195 L 480 226 L 555 98" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)"/>

  <!-- ==================== PIVOT NODES & ANNOTATIONS ==================== -->
  <!-- Point A -->
  <circle cx="85" cy="395" r="6" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5"/>
  <rect x="42" y="406" width="115" height="28" rx="4" fill="#0f172a" stroke="#1e283d" stroke-width="1"/>
  <text x="99" y="419" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#d4af37" text-anchor="middle">POINT A (Origin)</text>
  <text x="99" y="430" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8e9bb0" text-anchor="middle">Swing Low: 100.0</text>

  <!-- Point B -->
  <circle cx="205" cy="295" r="6" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.5"/>
  <rect x="145" y="252" width="120" height="32" rx="4" fill="#0f172a" stroke="#d4af37" stroke-width="1"/>
  <text x="205" y="266" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#f3e5ab" text-anchor="middle">POINT B (Peak)</text>
  <text x="205" y="279" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8e9bb0" text-anchor="middle">Impulse High: 200.0</text>

  <!-- Point C -->
  <circle cx="295" cy="357" r="6.5" fill="#d4af37" stroke="#0a0f1a" stroke-width="2"/>
  <rect x="225" y="369" width="165" height="36" rx="4" fill="#0f172a" stroke="#d4af37" stroke-width="1.2"/>
  <text x="307" y="383" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#d4af37" text-anchor="middle">POINT C (Golden Pocket)</text>
  <text x="307" y="397" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981" text-anchor="middle">0.618 Retracement (138.2)</text>

  <!-- Target Hit Nodes -->
  <!-- Node @ 1.000 -->
  <circle cx="365" cy="257" r="4.5" fill="#8e9bb0" stroke="#0a0f1a" stroke-width="1.5"/>
  
  <!-- Node @ 1.272 -->
  <circle cx="421" cy="230" r="4.5" fill="#10b981" stroke="#0a0f1a" stroke-width="1.5"/>

  <!-- Node @ 1.618 (Cluster Hit) -->
  <circle cx="455" cy="195" r="7" fill="#d4af37" stroke="#0a0f1a" stroke-width="2" filter="url(#glow-gold)"/>
  <circle cx="455" cy="195" r="11" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="445" y="185" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f3e5ab" text-anchor="end">TP2 HIT (300.0)</text>

  <!-- Node @ 2.618 (Euphoria Hit) -->
  <circle cx="558" cy="95" r="6" fill="#00f0ff" stroke="#0a0f1a" stroke-width="2" filter="url(#glow-cyan)"/>
  <text x="544" y="88" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00f0ff" text-anchor="end">WAVE 3 EXT (400.0)</text>

  <!-- ==================== BOTTOM INSTITUTIONAL NOTES ==================== -->
  <g transform="translate(420, 392)">
    <rect x="0" y="0" width="465" height="44" rx="5" fill="#0d1424" stroke="#1e283d" stroke-width="1"/>
    <circle cx="16" cy="22" r="4" fill="#f43f5e"/>
    <text x="28" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">
      INSTITUTIONAL EXECUTION NOTE — FIBONACCI CONFLUENCE:
    </text>
    <text x="28" y="33" font-family="'Inter', sans-serif" font-size="9.5" fill="#8e9bb0">
      Saat <tspan fill="#d4af37" font-weight="600">1.272–1.618 APP</tspan> bertemu <tspan fill="#f43f5e" font-weight="600">1.618 HTF Retracement</tspan>, algoritma institusi memicu distribusi masif.
    </text>
  </g>
</svg>