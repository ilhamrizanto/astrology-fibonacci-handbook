<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="auto">
  <defs>
    <!--  Grid Pattern  -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e283d" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!--  Confluence Box Gradient  -->
    <linearGradient id="confluenceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.10"/>
    </linearGradient>

    <!--  FVG Gradient  -->
    <linearGradient id="fvgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.06"/>
    </linearGradient>

    <!--  Order Block Gradient  -->
    <linearGradient id="obGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.08"/>
    </linearGradient>

    <!--  Arrow Markers  -->
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d4af37"/>
    </marker>
  </defs>

  <!--  Main Background  -->
  <rect x="2" y="2" width="916" height="456" rx="10" fill="#0a0f1a" stroke="#1e283d" stroke-width="2"/>
  <rect x="2" y="2" width="916" height="456" rx="10" fill="url(#bgGrid)"/>

  <!--  Header Section  -->
  <rect x="2" y="2" width="916" height="52" rx="10" fill="#0d1424" stroke="#1e283d" stroke-width="1"/>
  <text x="24" y="25" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" fill="#e2e8f0" letter-spacing="0.6">
    MIKROSTRUKTUR PELATUK EKSEKUSI: <tspan fill="#00f0ff">LIQUIDITY SWEEP</tspan>, <tspan fill="#d4af37">ChoCH</tspan> &amp; <tspan fill="#10b981">ORDER BLOCK SNIPER ENTRY</tspan>
  </text>
  <text x="24" y="43" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8e9bb0">
    ZOOMED-IN 4H / 1H EXECUTION SEQUENCE &#8226; WYCKOFF SPRING &#8594; DISPLACEMENT &#8594; FVG/OB MITIGATION
  </text>
  <rect x="785" y="15" width="115" height="24" rx="4" fill="#131c31" stroke="#d4af37" stroke-width="1"/>
  <text x="842.5" y="31" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f3e5ab" text-anchor="middle">
    TIMEFRAME: 4H/1H
  </text>

  <!--  HTF CONFLUENCE BOX (Golden Pocket + Time Window)  -->
  <rect x="260" y="265" width="510" height="155" rx="6" fill="url(#confluenceGrad)" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="268" y="395" width="355" height="19" rx="3" fill="#0a0f1a" opacity="0.85"/>
  <text x="274" y="408" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#d4af37" letter-spacing="0.4">
    THE CONFLUENCE BOX (HTF GOLDEN POCKET 0.618-0.786 &#215; TIME WINDOW)
  </text>

  <!--  BULLISH ORDER BLOCK (OB) ZONE  -->
  <rect x="332" y="280" width="335" height="32" fill="url(#obGrad)" stroke="#d4af37" stroke-width="1"/>
  <text x="658" y="306" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f3e5ab" text-anchor="end">
    BULLISH ORDER BLOCK (OB)
  </text>

  <!--  FAIR VALUE GAP (FVG) ZONE  -->
  <rect x="366" y="232" width="301" height="40" fill="url(#fvgGrad)" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="658" y="246" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00f0ff" text-anchor="end">
    FAIR VALUE GAP (FVG / IMBALANCE)
  </text>

  <!--  EQUAL LOWS & RETAIL STOP LOSS POOL  -->
  <line x1="95" y1="265" x2="365" y2="265" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="95" y="267" width="230" height="22" rx="3" fill="#f43f5e" fill-opacity="0.12"/>
  <text x="210" y="282" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f43f5e" text-anchor="middle">
    &#9760; $$$ RETAIL STOP LOSS POOL (SSL) $$$
  </text>

  <!--  ChoCH / MARKET STRUCTURE SHIFT LEVEL  -->
  <line x1="255" y1="185" x2="545" y2="185" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="6,4"/>
  <rect x="295" y="164" width="160" height="17" rx="3" fill="#0a0f1a" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="375" y="176" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00f0ff" text-anchor="middle">
    ChoCH / MSS (BREAK OF LH)
  </text>

  <!--  =================================================================  -->
  <!--  CANDLESTICK SEQUENCE (4H / 1H MICROSTRUCTURE)                      -->
  <!--  =================================================================  -->

  <!--  C1: Bearish into 1st Low  -->
  <line x1="90" y1="180" x2="90" y2="245" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="83" y="190" width="14" height="45" rx="1" fill="#f43f5e"/>

  <!--  C2: Bearish hitting 1st Equal Low (265)  -->
  <line x1="125" y1="230" x2="125" y2="265" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="118" y="235" width="14" height="25" rx="1" fill="#f43f5e"/>
  <circle cx="125" cy="265" r="3.5" fill="none" stroke="#f3e5ab" stroke-width="1.5"/>

  <!--  C3: Bullish bounce  -->
  <line x1="160" y1="210" x2="160" y2="262" stroke="#10b981" stroke-width="1.5"/>
  <rect x="153" y="215" width="14" height="45" rx="1" fill="#10b981"/>

  <!--  C4: Bearish pullback toward 2nd Low  -->
  <line x1="195" y1="212" x2="195" y2="265" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="188" y="215" width="14" height="43" rx="1" fill="#f43f5e"/>
  <circle cx="195" cy="265" r="3.5" fill="none" stroke="#f3e5ab" stroke-width="1.5"/>

  <!--  C5: Bullish bounce to Last Lower High (185)  -->
  <line x1="230" y1="195" x2="230" y2="260" stroke="#10b981" stroke-width="1.5"/>
  <rect x="223" y="200" width="14" height="58" rx="1" fill="#10b981"/>

  <!--  C6: Last Lower High (185) rejection  -->
  <line x1="265" y1="185" x2="265" y2="245" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="258" y="200" width="14" height="38" rx="1" fill="#f43f5e"/>
  <circle cx="265" cy="185" r="4" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2"/>
  <text x="265" y="175" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#8e9bb0" text-anchor="middle">LH</text>

  <!--  C7: Bearish drop into Confluence Box  -->
  <line x1="305" y1="232" x2="305" y2="285" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="298" y="238" width="14" height="42" rx="1" fill="#f43f5e"/>

  <!--  C8: LIQUIDITY SWEEP / WYCKOFF SPRING / ORDER BLOCK ORIGIN  -->
  <!--  Long lower wick down to 362  -->
  <line x1="345" y1="272" x2="345" y2="362" stroke="#f43f5e" stroke-width="2.2"/>
  <rect x="337" y="280" width="16" height="20" rx="1.5" fill="#d4af37" stroke="#f3e5ab" stroke-width="1"/>
  <!--  Stop Hunt Absorption Glow Circle  -->
  <circle cx="345" cy="362" r="5" fill="#f43f5e" stroke="#f3e5ab" stroke-width="1.5"/>

  <!--  C9: Bullish engulfing off the OB  -->
  <line x1="380" y1="252" x2="380" y2="305" stroke="#10b981" stroke-width="1.5"/>
  <rect x="373" y="258" width="14" height="42" rx="1" fill="#10b981"/>

  <!--  C10: DISPLACEMENT CANDLE (Strong impulse creating FVG & breaking ChoCH)  -->
  <line x1="415" y1="188" x2="415" y2="262" stroke="#10b981" stroke-width="2"/>
  <rect x="407" y="192" width="16" height="66" rx="1.5" fill="#10b981" stroke="#00f0ff" stroke-width="1"/>

  <!--  C11: Follow-through breaking above ChoCH (185)  -->
  <line x1="450" y1="145" x2="450" y2="232" stroke="#10b981" stroke-width="1.5"/>
  <rect x="443" y="152" width="14" height="40" rx="1" fill="#10b981"/>

  <!--  C12: Local Swing High & start of pullback  -->
  <line x1="490" y1="142" x2="490" y2="198" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="483" y="152" width="14" height="38" rx="1" fill="#f43f5e"/>

  <!--  C13: Controlled bearish pullback  -->
  <line x1="525" y1="185" x2="525" y2="238" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="518" y="190" width="14" height="42" rx="1" fill="#f43f5e"/>

  <!--  C14: Deeper pullback into FVG  -->
  <line x1="560" y1="225" x2="560" y2="275" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="553" y="232" width="14" height="36" rx="1" fill="#f43f5e"/>

  <!--  C15: SNIPER RETEST CANDLE (taps OB at 282, fills FVG, rejects up)  -->
  <line x1="595" y1="225" x2="595" y2="286" stroke="#10b981" stroke-width="2"/>
  <rect x="588" y="235" width="14" height="33" rx="1" fill="#10b981"/>
  <!--  Sniper Entry Crosshair  -->
  <circle cx="595" cy="280" r="6" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="595" cy="280" r="2" fill="#00f0ff"/>

  <!--  C16: Bullish Expansion after Entry  -->
  <line x1="630" y1="175" x2="630" y2="240" stroke="#10b981" stroke-width="1.5"/>
  <rect x="623" y="182" width="14" height="53" rx="1" fill="#10b981"/>

  <!--  C17: Strong Continuation  -->
  <line x1="665" y1="120" x2="665" y2="188" stroke="#10b981" stroke-width="1.5"/>
  <rect x="658" y="128" width="14" height="54" rx="1" fill="#10b981"/>

  <!--  =================================================================  -->
  <!--  NUMBERED CALLOUT BOXES (1 TO 4)                                    -->
  <!--  =================================================================  -->

  <!--  CALLOUT 1: EQUAL LOWS  -->
  <rect x="24" y="82" width="245" height="62" rx="6" fill="#111a2e" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="36" y="102" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f43f5e">
    1. EQUAL LOWS (RETAIL STOP POOL)
  </text>
  <text x="36" y="119" font-family="'Inter', sans-serif" font-size="10" fill="#e2e8f0">
    Twin bottoms form above Golden Pocket;
  </text>
  <text x="36" y="133" font-family="'Inter', sans-serif" font-size="10" fill="#8e9bb0">
    retail clusters Stop Losses just beneath.
  </text>
  <path d="M 145 144 L 145 256" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowRose)"/>

  <!--  CALLOUT 2: LIQUIDITY SWEEP  -->
  <rect x="24" y="330" width="225" height="86" rx="6" fill="#111a2e" stroke="#d4af37" stroke-width="1.2"/>
  <text x="36" y="350" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f3e5ab">
    2. LIQUIDITY SWEEP (SPRING)
  </text>
  <text x="36" y="366" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f43f5e">
    @ CONFLUENCE TIME WINDOW
  </text>
  <text x="36" y="383" font-family="'Inter', sans-serif" font-size="10" fill="#e2e8f0">
    Sharp dip sweeps Equal Lows inside box;
  </text>
  <text x="36" y="397" font-family="'Inter', sans-serif" font-size="10" fill="#d4af37">
    Stop Hunt Absorption wick (Smart Money).
  </text>
  <path d="M 249 362 L 333 362" fill="none" stroke="#d4af37" stroke-width="1.5" marker-end="url(#arrowGold)"/>
  <text x="345" y="382" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f43f5e" text-anchor="middle">
    STOP HUNT ABSORPTION
  </text>

  <!--  CALLOUT 3: DISPLACEMENT + FVG + ChoCH  -->
  <rect x="295" y="72" width="265" height="68" rx="6" fill="#111a2e" stroke="#00f0ff" stroke-width="1.2"/>
  <text x="307" y="92" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#00f0ff">
    3. DISPLACEMENT + FVG + ChoCH (MSS)
  </text>
  <text x="307" y="109" font-family="'Inter', sans-serif" font-size="10" fill="#e2e8f0">
    Impulsive bullish surge breaks Lower High,
  </text>
  <text x="307" y="123" font-family="'Inter', sans-serif" font-size="10" fill="#8e9bb0">
    leaving Fair Value Gap &amp; Bullish Order Block.
  </text>
  <path d="M 415 140 L 415 182" fill="none" stroke="#00f0ff" stroke-width="1.2" marker-end="url(#arrowCyan)"/>

  <!--  CALLOUT 4: SNIPER ENTRY & R:R VISUALIZER  -->
  <rect x="585" y="72" width="315" height="68" rx="6" fill="#111a2e" stroke="#10b981" stroke-width="1.2"/>
  <text x="597" y="92" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#10b981">
    4. SNIPER ENTRY ON OB / FVG RETEST
  </text>
  <text x="597" y="109" font-family="'Inter', sans-serif" font-size="10" fill="#e2e8f0">
    Clean pullback mitigates FVG &amp; Order Block &#8594;
  </text>
  <text x="597" y="123" font-family="'Inter', sans-serif" font-size="10" fill="#f3e5ab">
    High-precision entry + tight invalidation below wick.
  </text>

  <!--  =================================================================  -->
  <!--  SNIPER EXECUTION POSITION TOOL (ENTRY / SL / TP R:R >= 1:3)        -->
  <!--  =================================================================  -->

  <!--  Reward Box (TP Zone: y=95 to y=280 -> 185px height)  -->
  <rect x="690" y="95" width="195" height="185" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <!--  Risk Box (SL Zone: y=280 to y=368 -> 88px height)  -->
  <rect x="690" y="280" width="195" height="88" fill="#f43f5e" fill-opacity="0.16" stroke="#f43f5e" stroke-width="1"/>

  <!--  Target Line  -->
  <line x1="690" y1="95" x2="885" y2="95" stroke="#10b981" stroke-width="2"/>
  <rect x="700" y="103" width="175" height="22" rx="4" fill="#0a0f1a" stroke="#10b981" stroke-width="1"/>
  <text x="787.5" y="118" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">
    EXPANSION TARGET (R:R &#8805; 1:3)
  </text>

  <!--  Upward Expansion Trajectory Arrow  -->
  <path d="M 595 280 L 665 135 L 735 100" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrowEmerald)"/>

  <!--  Entry Line (y=280)  -->
  <line x1="595" y1="280" x2="885" y2="280" stroke="#00f0ff" stroke-width="1.8"/>
  <rect x="698" y="269" width="180" height="22" rx="4" fill="#0d182c" stroke="#00f0ff" stroke-width="1.2"/>
  <text x="788" y="284" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00f0ff" text-anchor="middle">
    &#9654; SNIPER LIMIT ENTRY (OB)
  </text>

  <!--  Stop Loss / Invalidation Line (y=368, right below Sweep Wick at 362)  -->
  <line x1="345" y1="368" x2="885" y2="368" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="698" y="357" width="180" height="22" rx="4" fill="#1f1220" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="788" y="372" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f43f5e" text-anchor="middle">
    STOP LOSS (INVALIDATION)
  </text>

  <!--  R:R Metrics Badge inside Reward Zone  -->
  <rect x="720" y="170" width="135" height="44" rx="6" fill="#0a0f1a" fill-opacity="0.9" stroke="#d4af37" stroke-width="1"/>
  <text x="787.5" y="189" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f3e5ab" text-anchor="middle">
    ASYMMETRIC R:R &#8805; 1:3
  </text>
  <text x="787.5" y="205" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981" text-anchor="middle">
    +3.2R IMPULSE WAVE
  </text>
  <line x1="787.5" y1="265" x2="787.5" y2="218" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
</svg>