<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="auto" style="background-color: #0a0f1a; font-family: 'Inter', system-ui, sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="bgGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e283d" stroke-width="0.5" opacity="0.45"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="goldCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2211"/>
      <stop offset="50%" stop-color="#17140d"/>
      <stop offset="100%" stop-color="#2e240e"/>
    </linearGradient>

    <linearGradient id="emeraldHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d4af37"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Outer Frame & Background -->
  <rect x="2" y="2" width="916" height="416" rx="10" fill="#0a0f1a" stroke="#1e283d" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="416" rx="10" fill="url(#bgGrid)"/>

  <!-- ================= HEADER ================= -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <text y="0" fill="#f3e5ab" font-size="13.5" font-weight="800" letter-spacing="1.4">
      ARSITEKTUR SINTESIS TERPADU: PENGGABUNGAN TIME FILTER &amp; SPACE FILTER
    </text>
    <text y="18" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.6">
      DUAL-ENGINE QUANTITATIVE &amp; ASTRO-GEOMETRIC CONFLUENCE PIPELINE
    </text>
    <line x1="-320" y1="27" x2="320" y2="27" stroke="#1e283d" stroke-width="1"/>
    <line x1="-90" y1="27" x2="90" y2="27" stroke="#d4af37" stroke-width="1.5"/>
  </g>

  <!-- ================= ENGINE 1: TOP-LEFT (TIME FILTER) ================= -->
  <g transform="translate(26, 68)">
    <!-- Card Body -->
    <rect x="0" y="0" width="295" height="150" rx="7" fill="url(#cardBg)" stroke="#1e283d" stroke-width="1.2"/>
    <!-- Left Accent Bar -->
    <path d="M 6 0 L 0 0 L 0 150 L 6 150" fill="#00f0ff"/>
    
    <!-- Header -->
    <text x="16" y="21" fill="#00f0ff" font-size="10.5" font-weight="700" letter-spacing="0.5">
      ENGINE 1: TIME FILTER (FINANCIAL ASTROLOGY)
    </text>
    <line x1="12" y1="30" x2="283" y2="30" stroke="#1e283d" stroke-width="1"/>

    <!-- Item 1 -->
    <circle cx="20" cy="46" r="2.5" fill="#00f0ff"/>
    <text x="30" y="50" fill="#e2e8f0" font-size="11">
      Siklus Lunar <tspan fill="#8e9bb0" font-size="10">(Dichev-Janes &amp; Yuan et al.)</tspan>
    </text>

    <!-- Item 2 -->
    <circle cx="20" cy="68" r="2.5" fill="#00f0ff"/>
    <text x="30" y="72" fill="#e2e8f0" font-size="11">
      Bradley Siderograph <tspan fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10.5">S(t)</tspan>
    </text>

    <!-- Item 3 -->
    <circle cx="20" cy="90" r="2.5" fill="#00f0ff"/>
    <text x="30" y="94" fill="#e2e8f0" font-size="11">
      Aspek Planet &amp; Ephemeris <tspan fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10">(0°, 90°, 180°)</tspan>
    </text>

    <!-- Output Ribbon -->
    <rect x="12" y="109" width="271" height="30" rx="5" fill="#071927" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.7"/>
    <text x="147.5" y="128" text-anchor="middle" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.3">
      OUT: JENDELA TANGGAL PEMBALIKAN (WHEN)
    </text>
  </g>

  <!-- ================= ENGINE 2: BOTTOM-LEFT (SPACE FILTER) ================= -->
  <g transform="translate(26, 240)">
    <!-- Card Body -->
    <rect x="0" y="0" width="295" height="150" rx="7" fill="url(#cardBg)" stroke="#1e283d" stroke-width="1.2"/>
    <!-- Left Accent Bar -->
    <path d="M 6 0 L 0 0 L 0 150 L 6 150" fill="#d4af37"/>
    
    <!-- Header -->
    <text x="16" y="21" fill="#f3e5ab" font-size="10.5" font-weight="700" letter-spacing="0.5">
      ENGINE 2: SPACE FILTER (FRACTAL FIBONACCI)
    </text>
    <line x1="12" y1="30" x2="283" y2="30" stroke="#1e283d" stroke-width="1"/>

    <!-- Item 1 -->
    <circle cx="20" cy="46" r="2.5" fill="#d4af37"/>
    <text x="30" y="50" fill="#e2e8f0" font-size="11">
      Rasio Golden Pocket <tspan fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="10">(0.618 – 0.650)</tspan>
    </text>

    <!-- Item 2 -->
    <circle cx="20" cy="68" r="2.5" fill="#d4af37"/>
    <text x="30" y="72" fill="#e2e8f0" font-size="11">
      Gann Square of <tspan fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="10.5">9</tspan> Target Levels
    </text>

    <!-- Item 3 -->
    <circle cx="20" cy="90" r="2.5" fill="#d4af37"/>
    <text x="30" y="94" fill="#e2e8f0" font-size="11">
      Pure Market Structure &amp; Order Blocks
    </text>

    <!-- Output Ribbon -->
    <rect x="12" y="109" width="271" height="30" rx="5" fill="#1f190b" stroke="#d4af37" stroke-width="1" stroke-opacity="0.7"/>
    <text x="147.5" y="128" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.3">
      OUT: KOORDINAT HARGA OPTIMAL (WHERE)
    </text>
  </g>

  <!-- ================= SIGNAL ROUTING LINES ================= -->
  <!-- Engine 1 (When) -> Confluence Diamond -->
  <path d="M 321 192 L 352 192 L 372 212 L 392 212" fill="none" stroke="#00f0ff" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <circle cx="321" cy="192" r="3" fill="#00f0ff"/>
  <text x="354" y="184" text-anchor="middle" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="8.5" opacity="0.85">T-SYNC</text>

  <!-- Engine 2 (Where) -> Confluence Diamond -->
  <path d="M 321 364 L 352 364 L 372 246 L 392 246" fill="none" stroke="#d4af37" stroke-width="1.8" marker-end="url(#arrowGold)"/>
  <circle cx="321" cy="364" r="3" fill="#d4af37"/>
  <text x="354" y="377" text-anchor="middle" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="8.5" opacity="0.85">P-SYNC</text>

  <!-- Confluence Diamond -> Final Execution Card -->
  <path d="M 552 229 L 605 229" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrowEmerald)" filter="url(#softGlow)"/>
  <text x="579" y="219" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">VALIDATED</text>

  <!-- ================= CENTER CONVERGENCE GATE (DIAMOND CORE) ================= -->
  <g transform="translate(472, 229)">
    <!-- Ambient Outer Orbit Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="3 5" opacity="0.45"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.25"/>

    <!-- Outer Glowing Gold Diamond -->
    <polygon points="0,-78 78,0 0,78 -78,0" fill="url(#goldCoreGrad)" stroke="#d4af37" stroke-width="2" filter="url(#goldGlow)"/>

    <!-- Inner Precision Diamond Frame -->
    <polygon points="0,-68 68,0 0,68 -68,0" fill="none" stroke="#f3e5ab" stroke-width="0.8" stroke-dasharray="5 3" opacity="0.75"/>

    <!-- Corner Axis Nodes -->
    <circle cx="0" cy="-78" r="3" fill="#f3e5ab"/>
    <circle cx="78" cy="0" r="3" fill="#10b981"/>
    <circle cx="0" cy="78" r="3" fill="#f3e5ab"/>
    <circle cx="-78" cy="0" r="3" fill="#00f0ff"/>

    <!-- Core Matrix Labels -->
    <text y="-21" text-anchor="middle" fill="#f3e5ab" font-size="10.5" font-weight="800" letter-spacing="1.2">
      TIME-PRICE
    </text>
    <text y="-5" text-anchor="middle" fill="#d4af37" font-size="11" font-weight="800" letter-spacing="1">
      CONFLUENCE
    </text>
    <text y="11" text-anchor="middle" fill="#f3e5ab" font-size="10.5" font-weight="800" letter-spacing="1.2">
      MATRIX
    </text>

    <!-- Logic Pill Badge -->
    <rect x="-42" y="21" width="84" height="17" rx="4" fill="#0a0f1a" stroke="#d4af37" stroke-width="0.9"/>
    <text x="0" y="33" text-anchor="middle" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">
      WHEN &#8745; WHERE
    </text>
  </g>

  <!-- ================= RIGHT FINAL OUTPUT CARD (EXECUTION) ================= -->
  <g transform="translate(613, 104)">
    <!-- Outer Card -->
    <rect x="0" y="0" width="281" height="250" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- Top Header Banner -->
    <path d="M 1 8 Q 1 1 8 1 L 273 1 Q 280 1 280 8 L 280 42 L 1 42 Z" fill="url(#emeraldHeader)"/>
    <line x1="0" y1="42" x2="281" y2="42" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Status Indicator & Header Title -->
    <circle cx="20" cy="22" r="4.5" fill="#10b981" filter="url(#softGlow)"/>
    <text x="33" y="26" fill="#e2e8f0" font-size="11.5" font-weight="800" letter-spacing="0.7">
      ACTIONABLE TRADE EXECUTION
    </text>

    <!-- Module 1: Optimal Trade Entry (OTE) -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="253" height="52" rx="5" fill="#0c1926" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#00f0ff"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="11" font-weight="700">
        Presisi Entri Optimal <tspan fill="#00f0ff" font-family="'JetBrains Mono', monospace">(OTE)</tspan>
      </text>
      <text x="14" y="38" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5">
        Trigger: High-Prob Liquidity Sweep
      </text>
    </g>

    <!-- Module 2: Stop Loss Invalidation -->
    <g transform="translate(14, 120)">
      <rect x="0" y="0" width="253" height="52" rx="5" fill="#1f101b" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#f43f5e"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="11" font-weight="700">
        Batas Invalidasi Ketat
      </text>
      <text x="14" y="38" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
        Stop Loss Non-Negosiasi (Hard SL)
      </text>
    </g>

    <!-- Module 3: Target Extension -->
    <g transform="translate(14, 184)">
      <rect x="0" y="0" width="253" height="52" rx="5" fill="#0b211d" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#10b981"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="11" font-weight="700">
        Target Ekstensi <tspan fill="#f3e5ab" font-family="'JetBrains Mono', monospace">1.618</tspan>
      </text>
      <text x="14" y="38" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">
        Asymmetric Payoff (R:R &#8805; 1:2)
      </text>
    </g>
  </g>

  <!-- ================= FOOTER TELEMETRY BAR ================= -->
  <g transform="translate(460, 405)" text-anchor="middle">
    <text fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.8" opacity="0.75">
      SYS-ARCH: FILTER_1 [TIME/ASTRO] + FILTER_2 [SPACE/FIBO-GANN] &#8594; CONFLUENCE_GATE &#8594; EXECUTION_PROTOCOL
    </text>
  </g>
</svg>