    <!--  Breadth Pivot Nodes  -->
    <!--  Trough 1 (Extreme Oversold)  -->
    <circle cx="240" cy="318" r="4.5" fill="#0a0f1a" stroke="#f43f5e" stroke-width="2"/>
    <rect x="135" y="308" width="96" height="16" rx="2" fill="#111927" stroke="#1e283d" stroke-width="0.8"/>
    <text x="183" y="319" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f43f5e" text-anchor="middle">MAX SELLING (-165)</text>

    <!--  Trough 2 (Higher Low Confirmation)  -->
    <circle cx="490" cy="277" r="5.5" fill="#10b981" stroke="#0a0f1a" stroke-width="1.5"/>
    <circle cx="490" cy="277" r="9.5" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="2,2"/>

