      </text>
    </g>

    <!--  Liquidity Sweep Level Line (Low 1 Reference)  -->
    <line x1="240" y1="110" x2="490" y2="110" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>
    <text x="365" y="106" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f43f5e" text-anchor="middle" opacity="0.9">
      SELL-SIDE LIQUIDITY (STOP HUNT)
    </text>

    <!--  Price Index Area Fill  -->
    <path d="M 15 28 L 65 44 L 105 32 L 155 72 L 195 60 L 240 110 L 285 74 L 325 84 L 365 56 L 410 92 L 445 82 L 490 138 L 525 112 L 560 95 L 605 58 L 645 68 L 695 26 L 745 14 L 745 160 L 15 160 Z" fill="url(#price-area)"/>

