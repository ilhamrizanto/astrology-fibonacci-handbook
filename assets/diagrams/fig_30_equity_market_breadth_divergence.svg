      </text>
      <text x="75" y="13" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a7f3d0" text-anchor="middle">
        INSTITUTIONAL SOS RALLY
      </text>
    </g>


    <!--  ================= BOTTOM PANEL: MCCLELLAN OSC & A-D LINE =================  -->
    <!--  Zero Baseline (Y = 238 in main coords -> 64 inside panel 2)  -->
    <line x1="0" y1="238" x2="790" y2="238" stroke="#8e9bb0" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.8"/>
    <rect x="6" y="229" width="54" height="14" rx="2" fill="#0a0f1a"/>
    <text x="10" y="239" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#8e9bb0">ZERO (0)</text>

    <!--  Extreme Oversold Threshold Line (Y = 310)  -->
    <line x1="0" y1="310" x2="790" y2="310" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.45"/>
    <text x="784" y="306" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f43f5e" text-anchor="end" opacity="0.7">
      EXTREME BREADTH WASHOUT (-150)
    </text>

    <!--  McClellan Oscillator Histogram Bars (Baseline Y = 238)  -->
    <!--  Early bars  -->
    <g opacity="0.85">
      <rect x="25" y="232" width="8" height="6" fill="#10b981" rx="1"/>
      <rect x="45" y="238" width="8" height="10" fill="#f43f5e" rx="1"/>
      <rect x="65" y="238" width="8" height="18" fill="#f43f5e" rx="1"/>
      <rect x="85" y="238" width="8" height="12" fill="#f43f5e" rx="1"/>
      <rect x="105" y="234" width="8" height="4" fill="#10b981" rx="1"/>
      <rect x="125" y="238" width="8" height="16" fill="#f43f5e" rx="1"/>
      <rect x="145" y="238" width="8" height="28" fill="#f43f5e" rx="1"/>
      <rect x="165" y="238" width="8" height="36" fill="#f43f5e" rx="1"/>
      <rect x="185" y="238" width="8" height="30" fill="#f43f5e" rx="1"/>
      <rect x="205" y="238" width="8" height="50" fill="#f43f5e" rx="1"/>
      <rect x="220" y="238" width="8" height="66" fill="#f43f5e" rx="1"/>
      <!--  T1 Climax Trough (X = 240, Deepest Washout)  -->
      <rect x="236" y="238" width="8" height="80" fill="#f43f5e" rx="1" stroke="#fda4af" stroke-width="0.6"/>
      <rect x="252" y="238" width="8" height="58" fill="#f43f5e" rx="1"/>
      <rect x="270" y="238" width="8" height="34" fill="#f43f5e" rx="1"/>
      <rect x="290" y="238" width="8" height="16" fill="#f43f5e" rx="1"/>
      <rect x="310" y="233" width="8" height="5" fill="#10b981" rx="1"/>
      <rect x="330" y="226" width="8" height="12" fill="#10b981" rx="1"/>
      <rect x="350" y="220" width="8" height="18" fill="#10b981" rx="1"/>
      <rect x="370" y="228" width="8" height="10" fill="#10b981" rx="1"/>
      <rect x="390" y="238" width="8" height="10" fill="#f43f5e" rx="1"/>
      <rect x="410" y="238" width="8" height="22" fill="#f43f5e" rx="1"/>
      <rect x="430" y="238" width="8" height="15" fill="#f43f5e" rx="1"/>
      <rect x="450" y="238" width="8" height="26" fill="#f43f5e" rx="1"/>
      <rect x="470" y="238" width="8" height="34" fill="#f43f5e" rx="1"/>
      <!--  T2 Confluence Trough (X = 490, Shallower Higher Low!)  -->
      <rect x="486" y="238" width="8" height="39" fill="#d4af37" rx="1" stroke="#f3e5ab" stroke-width="0.8"/>
      <rect x="504" y="238" width="8" height="22" fill="#f43f5e" rx="1"/>
      <rect x="522" y="238" width="8" height="8" fill="#f43f5e" rx="1"/>
      <!--  Zero Line Thrust Breakout  -->
      <rect x="540" y="226" width="8" height="12" fill="#10b981" rx="1"/>
      <rect x="560" y="214" width="8" height="24" fill="#10b981" rx="1"/>
      <rect x="580" y="202" width="8" height="36" fill="#10b981" rx="1"/>
      <rect x="600" y="192" width="8" height="46" fill="#10b981" rx="1"/>
      <rect x="620" y="198" width="8" height="40" fill="#10b981" rx="1"/>
      <rect x="640" y="204" width="8" height="34" fill="#10b981" rx="1"/>
      <rect x="660" y="190" width="8" height="48" fill="#10b981" rx="1"/>
      <rect x="680" y="186" width="8" height="52" fill="#10b981" rx="1"/>
      <rect x="700" y="184" width="8" height="54" fill="#10b981" rx="1"/>
      <rect x="720" y="188" width="8" height="50" fill="#10b981" rx="1"/>
      <rect x="740" y="182" width="8" height="56" fill="#10b981" rx="1"/>
