<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="auto">
  <defs>
    <!--  Grid Pattern  -->
    <pattern id="minor-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e283d" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor-grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e283d" stroke-width="0.8" opacity="0.8"/>
    </pattern>

    <!--  Linear Gradients  -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.28"/>
    </linearGradient>
    
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="price-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.0"/>
    </linearGradient>

    <!--  Arrow Markers  -->
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d4af37"/>
    </marker>

    <!--  Subtle Glow Filter  -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!--  Main Card Background  -->
  <rect x="2" y="2" width="916" height="416" rx="10" fill="#0a0f1a" stroke="#1e283d" stroke-width="1.5"/>

  <!--  Header Section  -->
  <g transform="translate(28, 28)">
    <rect x="0" y="-15" width="4" height="20" rx="2" fill="#d4af37"/>
    <text x="12" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="800" fill="#f3e5ab" letter-spacing="0.7">
      DIVERGENSI MARKET BREADTH (MCCLELLAN / A-D LINE) DI CONFLUENCE BOX
    </text>
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8e9bb0">
      INSTITUTIONAL ORDERFLOW &amp; INTERNAL BREADTH TELEMETRY // WYCKOFF SPRING CONFIRMATION
    </text>
    
    <!--  Top Right Legend Badge  -->
    <rect x="685" y="-14" width="177" height="24" rx="4" fill="#111927" stroke="#1e283d" stroke-width="1"/>
    <circle cx="699" cy="-2" r="3.5" fill="#10b981"/>
    <text x="709" y="2" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#e2e8f0">SIGNAL: BULLISH SPRING</text>
  </g>

  <!--  Chart Area Container (Grid)  -->
  <g transform="translate(55, 58)">
    <!--  Sub-chart 1: Price Index Panel (Height: 160)  -->
    <rect x="0" y="0" width="790" height="160" fill="url(#major-grid)" stroke="#1e283d" stroke-width="1"/>
    
    <!--  Sub-chart 2: Market Breadth Panel (Height: 160, Y: 174)  -->
    <rect x="0" y="174" width="790" height="160" fill="url(#major-grid)" stroke="#1e283d" stroke-width="1"/>

    <!--  Y-Axis Right Labels (Price)  -->
    <g font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e9bb0" text-anchor="start">
      <text x="798" y="24">5,240</text>
      <text x="798" y="64">5,120</text>
      <text x="798" y="104">5,000</text>
      <text x="798" y="144" fill="#d4af37" font-weight="600">4,880</text>
    </g>

    <!--  Y-Axis Right Labels (Breadth McClellan)  -->
    <g font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e9bb0" text-anchor="start">
      <text x="798" y="198">+100</text>
      <text x="798" y="242" fill="#e2e8f0">0.00</text>
      <text x="798" y="286">-100</text>
      <text x="798" y="324" fill="#f43f5e">-180</text>
    </g>

    <!--  Panel Watermarks / Sub-headers  -->
    <g transform="translate(12, 18)">
      <rect x="-4" y="-11" width="215" height="16" rx="2" fill="#0a0f1a" opacity="0.85"/>
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#8e9bb0" letter-spacing="0.5">
        01 // COMPOSITE PRICE INDEX (SPX / IHSG)
      </text>
    </g>
    
    <g transform="translate(12, 192)">
      <rect x="-4" y="-11" width="320" height="16" rx="2" fill="#0a0f1a" opacity="0.85"/>
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#00f0ff" letter-spacing="0.5">
        02 // MARKET BREADTH: MCCLELLAN OSC (HGM) &amp; A-D LINE
      </text>
    </g>

    <!--  ================= TIME CORRELATION SYNC LINES =================  -->
    <!--  T1: Phase A Selling Climax Low (X = 240)  -->
    <line x1="240" y1="0" x2="240" y2="334" stroke="#8e9bb0" stroke-width="1" stroke-dasharray="3,4" opacity="0.45"/>
    <!--  T2: Phase C Spring / Confluence Low (X = 490)  -->
    <line x1="490" y1="0" x2="490" y2="334" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.65"/>

    <!--  ================= TOP PANEL: PRICE ACTION & CONFLUENCE BOX =================  -->
    
    <!--  Institutional Confluence Box (Demand Zone)  -->
    <g transform="translate(425, 114)">
      <rect x="0" y="0" width="165" height="36" rx="3" fill="url(#gold-grad)" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="5,2"/>
      <!--  Corner Accents  -->
      <path d="M 0 6 L 0 0 L 6 0" fill="none" stroke="#f3e5ab" stroke-width="2"/>
      <path d="M 159 0 L 165 0 L 165 6" fill="none" stroke="#f3e5ab" stroke-width="2"/>
      <path d="M 0 30 L 0 36 L 6 36" fill="none" stroke="#f3e5ab" stroke-width="2"/>
      <path d="M 159 36 L 165 36 L 165 30" fill="none" stroke="#f3e5ab" stroke-width="2"/>
      
