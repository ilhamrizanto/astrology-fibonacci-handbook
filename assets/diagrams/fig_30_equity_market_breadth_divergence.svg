      <rect x="0" y="-12" width="150" height="32" rx="4" fill="#0d1f1d" stroke="#10b981" stroke-width="1.2"/>
      <text x="75" y="1" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#10b981" text-anchor="middle">
