    <path d="M 490 138 L 525 112 L 560 95 L 605 58 L 645 68 L 695 26 L 745 14" fill="none" stroke="#10b981" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

