    <text x="24" y="0">PRICE INDEX</text>

    <!--  Legend Item 2  -->
    <line x1="115" y1="-3" x2="133" y2="-3" stroke="#00f0ff" stroke-width="2.2"/>
    <text x="139" y="0" fill="#00f0ff">A-D LINE (CUMULATIVE BREADTH)</text>

    <!--  Legend Item 3  -->
    <rect x="335" y="-8" width="8" height="8" fill="#10b981" rx="1"/>
    <rect x="345" y="-8" width="8" height="8" fill="#f43f5e" rx="1"/>
    <text x="359" y="0">MCCLELLAN OSCILLATOR</text>

    <!--  Legend Item 4  -->
    <rect x="505" y="-8" width="12" height="8" fill="url(#gold-grad)" stroke="#d4af37" stroke-width="1"/>
