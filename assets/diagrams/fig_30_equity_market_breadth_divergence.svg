    <path d="M 15 28 L 65 44 L 105 32 L 155 72 L 195 60 L 240 110 L 285 74 L 325 84 L 365 56 L 410 92 L 445 82 L 490 138" fill="none" stroke="#cbd5e1" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

