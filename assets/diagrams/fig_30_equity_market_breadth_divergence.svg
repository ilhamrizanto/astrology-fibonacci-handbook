    <!--  Advance-Decline (A-D) Cumulative Line + Glow Area  -->
    <path d="M 15 210 L 65 224 L 105 218 L 155 256 L 195 252 L 240 318 L 285 268 L 325 260 L 365 224 L 410 258 L 445 250 L 490 277 L 525 246 L 560 216 L 605 192 L 645 198 L 695 184 L 745 180 L 745 334 L 15 334 Z" fill="url(#cyan-glow)"/>

    <path d="M 15 210 L 65 224 L 105 218 L 155 256 L 195 252 L 240 318 L 285 268 L 325 260 L 365 224 L 410 258 L 445 250 L 490 277 L 525 246 L 560 216 L 605 192 L 645 198 L 695 184 L 745 180" fill="none" stroke="#00f0ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

    <!--  Bullish Divergence Vector (Higher Low Line)  -->
    <line x1="240" y1="322" x2="478" y2="281" stroke="#10b981" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>

