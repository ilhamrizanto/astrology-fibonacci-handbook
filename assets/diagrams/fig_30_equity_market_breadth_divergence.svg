    <!--  Zero-Line Breadth Thrust Callout  -->
    <circle cx="536" cy="238" r="4" fill="#10b981" stroke="#0a0f1a" stroke-width="1.5"/>
    <path d="M 536 232 L 515 206" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2,2"/>
    <g transform="translate(425, 190)">
