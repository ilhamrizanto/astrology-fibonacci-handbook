  </text>
  <line x1="476" y1="96" x2="888" y2="96" stroke="#1e283d" stroke-width="1" />

  <!--  Chart Grid  -->
  <g stroke="#162032" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="490" y1="135" x2="885" y2="135" />
    <line x1="490" y1="225" x2="885" y2="225" />
    <line x1="490" y1="315" x2="885" y2="315" />
  </g>

  <!--  Price Chart Axes  -->
  <line x1="490" y1="108" x2="490" y2="338" stroke="#475569" stroke-width="1.2" />
  <line x1="490" y1="338" x2="888" y2="338" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)" />
  <text x="474" y="225" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e9bb0" transform="rotate(-90, 474, 225)" text-anchor="middle">
