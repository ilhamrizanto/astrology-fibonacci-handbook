  <!--  =========================================================================  -->
  <!--  BOTTOM INSTITUTIONAL EXECUTION RULE BOX (y=382..426)                       -->
  <!--  =========================================================================  -->
  <rect x="18" y="382" width="884" height="44" rx="6" fill="#11192c" stroke="#d4af37" stroke-width="1.3" />
  
  <!--  Left Badge  -->
  <rect x="28" y="391" width="152" height="26" rx="4" fill="#d4af37" />
  <text x="104" y="408" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0a0f1a" text-anchor="middle">
