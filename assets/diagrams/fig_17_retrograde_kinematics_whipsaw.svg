  </text>

  <!--  Liquidity Spring / SD Bottom Node (755, 288)  -->
  <circle cx="755" cy="288" r="5.5" fill="#00f0ff" stroke="#0a0f1a" stroke-width="1.5" filter="url(#glow-cyan)" />
  <text x="688" y="305" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00f0ff" text-anchor="middle">
