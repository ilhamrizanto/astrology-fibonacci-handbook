  </text>

  <!--  Equilibrium Mean Line (y=232)  -->
  <line x1="605" y1="232" x2="755" y2="232" stroke="#8e9bb0" stroke-width="1" stroke-dasharray="2,3" opacity="0.7" />
  <text x="680" y="227" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8e9bb0" text-anchor="middle">
