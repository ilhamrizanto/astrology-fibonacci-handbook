  <!--  Glowing Trigger Line 2: Station Direct (SD) at x=755  -->
  <line x1="755" y1="108" x2="755" y2="338" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="4,2" filter="url(#glow-cyan)" />
  <rect x="722" y="316" width="66" height="18" rx="3" fill="#102230" stroke="#00f0ff" stroke-width="1" />
  <text x="755" y="328" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#00f0ff" text-anchor="middle">
    SD (ω = 0)
  </text>

  <!--  False Breakout Trap Highlight Fill Above R1  -->
  <path d="M 587 185 L 605 136 L 624 185 Z" fill="url(#trap-grad)" />

  <!--  PRICE ACTION POLYLINE  -->
  <!--  1. Pre-Retrograde Build-up & Breakout Trap at SR  -->
  <polyline points="500,262 522,244 540,254 562,212 578,220 587,185 605,136" 
            fill="none" stroke="#d4af37" stroke-width="2.4" stroke-linejoin="round" />

  <!--  2. Sharp Whipsaw Reversal & Chop Inside Range (Retrograde Window)  -->
  <polyline points="605,136 624,185 638,266 658,205 680,272 704,196 728,258 755,288" 
            fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow-rose)" />

  <!--  3. True Trend Resumption After SD  -->
  <polyline points="755,288 776,235 792,245 812,185 832,155 850,164 878,118" 
            fill="none" stroke="#00f0ff" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-cyan)" />

  <!--  Critical Market Structure Annotations  -->
  <!--  False Breakout Node at SR Peak (605, 136)  -->
  <circle cx="605" cy="136" r="5.5" fill="#f43f5e" stroke="#0a0f1a" stroke-width="1.5" filter="url(#glow-rose)" />
  <rect x="616" y="109" width="166" height="32" rx="4" fill="#261019" stroke="#f43f5e" stroke-width="1.2" />
  <text x="699" y="123" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#f43f5e" text-anchor="middle">
