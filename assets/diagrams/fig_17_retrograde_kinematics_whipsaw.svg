  <!--  Key Support Line (y=280)  -->
  <line x1="490" y1="280" x2="885" y2="280" stroke="#10b981" stroke-width="1.3" stroke-dasharray="5,3" />
  <rect x="495" y="283" width="82" height="14" rx="2" fill="#0b111e" opacity="0.85" />
  <text x="498" y="293" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#10b981">
