  </text>

  <!--  5. Post-Retrograde Shadow Exit Node  -->
  <circle cx="336" cy="160" r="4.5" fill="#0b111e" stroke="#00f0ff" stroke-width="2" />
  <text x="344" y="175" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#00f0ff" text-anchor="start">
