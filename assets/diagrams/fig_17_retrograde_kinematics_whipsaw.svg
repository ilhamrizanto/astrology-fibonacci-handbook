  </text>

  <!--  Shaded Retrograde Whipsaw Window on Price Chart (x=605 to x=755)  -->
  <rect x="605" y="108" width="150" height="230" fill="url(#retro-zone)" />
  <text x="680" y="354" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#f43f5e" text-anchor="middle">
    &#8592; JENDELA RETROGRADE (CHOP / MEAN-REVERSION) &#8594;
  </text>

  <!--  Resistance & Support Horizontal Levels  -->
  <!--  Key Resistance Line (y=185)  -->
  <line x1="490" y1="185" x2="885" y2="185" stroke="#f43f5e" stroke-width="1.3" stroke-dasharray="5,3" />
  <rect x="495" y="169" width="92" height="14" rx="2" fill="#0b111e" opacity="0.85" />
  <text x="498" y="179" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#f43f5e">
