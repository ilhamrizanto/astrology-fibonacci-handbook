  <!--  Segment 1: Direct Pre-Shadow & Shadow Entry (ω > 0)  -->
  <path d="M 70 315 C 105 292, 130 272, 148 255 C 185 218, 255 160, 292 160" 
        fill="none" stroke="#10b981" stroke-width="2.6" marker-mid="url(#arrow-emerald)" />

  <!--  Segment 2: Retrograde Loop (ω < 0, Apparent Backward Motion in λ)  -->
  <path d="M 292 160 C 265 160, 215 255, 188 255" 
        fill="none" stroke="#f43f5e" stroke-width="3.2" filter="url(#glow-rose)" />
  <!--  Mid-retrograde directional arrow  -->
  <path d="M 250 198 L 232 216" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-rose)" />

  <!--  Segment 3: Post-Retrograde Direct Recovery & Shadow Exit (ω > 0)  -->
  <path d="M 188 255 C 225 255, 295 195, 336 160 C 365 135, 392 120, 418 112" 
        fill="none" stroke="#00f0ff" stroke-width="2.6" />
  <!--  Post-SD directional arrow  -->
  <path d="M 358 142 L 382 127" fill="none" stroke="#00f0ff" stroke-width="2.4" marker-end="url(#arrow-cyan)" />

