  </text>

  <!--  Glowing Trigger Line 1: Station Retrograde (SR) at x=605  -->
  <line x1="605" y1="108" x2="605" y2="338" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="4,2" filter="url(#glow-gold)" />
  <rect x="572" y="316" width="66" height="18" rx="3" fill="#161f33" stroke="#d4af37" stroke-width="1" />
  <text x="605" y="328" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#f3e5ab" text-anchor="middle">
