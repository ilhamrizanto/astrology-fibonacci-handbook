  </text>
  <text x="194" y="418" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e9bb0">
    FADE EKSTREM R1/S1 SAAT FASE <tspan fill="#f43f5e">ω &lt; 0</tspan> • TUNGGU KONFIRMASI <tspan fill="#00f0ff">STATION DIRECT (SD)</tspan> UNTUK POSITION SIZING TREND-FOLLOWING
  </text>
</svg>