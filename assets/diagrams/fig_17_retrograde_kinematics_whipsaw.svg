  </text>

  <!--  4. Station Direct (SD) Node  -->
  <circle cx="188" cy="255" r="6" fill="#00f0ff" stroke="#0a0f1a" stroke-width="1.5" filter="url(#glow-cyan)" />
  <rect x="126" y="294" width="124" height="34" rx="4" fill="#102230" stroke="#00f0ff" stroke-width="1.2" />
  <text x="188" y="308" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">
