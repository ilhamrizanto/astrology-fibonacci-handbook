  </text>

  <!--  Shaded Retrograde Window (Between SR x=292 and SD x=188 in Longitude band y=160..255)  -->
  <rect x="188" y="160" width="104" height="95" fill="url(#retro-zone)" />

  <!--  Horizontal Shadow Zone Bound Lines (λ_SD and λ_SR)  -->
  <!--  Upper Bound: λ_SR (y=160)  -->
  <line x1="55" y1="160" x2="425" y2="160" stroke="#d4af37" stroke-width="1" stroke-dasharray="4,4" opacity="0.65" />
  <text x="60" y="154" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#d4af37">
    λ_SR (Batas Atas Bayangan)
  </text>

  <!--  Lower Bound: λ_SD (y=255)  -->
  <line x1="55" y1="255" x2="425" y2="255" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,4" opacity="0.65" />
  <text x="60" y="268" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00f0ff">
    λ_SD (Batas Bawah Bayangan)
  </text>

  <!--  Glowing Vertical Trigger Lines for SR & SD  -->
  <!--  Station Direct (SD) Vertical Line at x=188  -->
  <line x1="188" y1="108" x2="188" y2="338" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#glow-cyan)" opacity="0.85" />
  <!--  Station Retrograde (SR) Vertical Line at x=292  -->
  <line x1="292" y1="108" x2="292" y2="338" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#glow-gold)" opacity="0.85" />

