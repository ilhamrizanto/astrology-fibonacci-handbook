  <!--  True Breakout Confirmation Node (812, 185)  -->
  <circle cx="812" cy="185" r="4.5" fill="#10b981" stroke="#0a0f1a" stroke-width="1.5" />
  <rect x="768" y="196" width="114" height="30" rx="4" fill="#0d2321" stroke="#10b981" stroke-width="1" />
  <text x="825" y="209" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#10b981" text-anchor="middle">
