  <rect x="196" y="196" width="90" height="28" rx="4" fill="#23121b" stroke="#f43f5e" stroke-width="0.9" opacity="0.9" />
  <text x="241" y="208" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#f43f5e" text-anchor="middle">
