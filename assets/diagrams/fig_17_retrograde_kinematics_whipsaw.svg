  <rect x="232" y="112" width="124" height="34" rx="4" fill="#161f33" stroke="#d4af37" stroke-width="1.2" />
  <text x="294" y="126" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#f3e5ab" text-anchor="middle">
