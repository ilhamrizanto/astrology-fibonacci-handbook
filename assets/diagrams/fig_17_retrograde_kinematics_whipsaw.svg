  </text>

  <!--  =========================================================================  -->
  <!--  RIGHT PANEL: MARKET PRICE ACTION & WHIPSAW CHART (x=462..902)              -->
  <!--  =========================================================================  -->
  <rect x="462" y="68" width="440" height="304" rx="6" fill="#0b111e" stroke="#1e283d" stroke-width="1" />

  <!--  Panel 2 Header  -->
  <text x="476" y="88" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f3e5ab" letter-spacing="0.4">
