<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto">
  <defs>
    <!--  Glow Filters  -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!--  Linear Gradients  -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="retro-zone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.10" />
    </linearGradient>
    <linearGradient id="trap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>

    <!--  Arrow Markers  -->
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4af37" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#8e9bb0" />
    </marker>
  </defs>

  <!--  Main Institutional Background  -->
  <rect x="2" y="2" width="916" height="436" rx="10" fill="url(#bg-grad)" stroke="#1e283d" stroke-width="1.5" />

  <!--  Top Header Banner  -->
  <rect x="18" y="14" width="884" height="44" rx="6" fill="#0f1626" stroke="#1e283d" stroke-width="1" />
  <text x="32" y="34" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.6">
    KINEMATIKA APPARENT RETROGRADE, TITIK STASIONER (<tspan fill="#d4af37" font-family="'JetBrains Mono', monospace">dλ/dt = 0</tspan>) &amp; EFEK WHIPSAW
  </text>
  <text x="32" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8e9bb0">
    GEOCENTRIC ECLIPTIC LONGITUDE (λ) VS. MARKET LIQUIDITY TRAP &amp; REGIME SHIFT
  </text>
  <rect x="768" y="24" width="120" height="24" rx="4" fill="#131c31" stroke="#d4af37" stroke-width="0.8" />
  <text x="828" y="40" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#f3e5ab" text-anchor="middle">
    RIZACORP QUANT
  </text>

  <!--  =========================================================================  -->
  <!--  LEFT PANEL: APPARENT RETROGRADE KINEMATICS (x=18..448)                     -->
  <!--  =========================================================================  -->
  <rect x="18" y="68" width="430" height="304" rx="6" fill="#0b111e" stroke="#1e283d" stroke-width="1" />
  
  <!--  Panel 1 Header  -->
  <text x="32" y="88" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#f3e5ab" letter-spacing="0.4">
    1. LINTASAN SEMU (Z-LOOP) &amp; FASE KECEPATAN SUDUT (ω)
  </text>
  <line x1="32" y1="96" x2="434" y2="96" stroke="#1e283d" stroke-width="1" />

  <!--  Subtle Celestial Grid  -->
  <g stroke="#162032" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="55" y1="130" x2="430" y2="130" />
    <line x1="55" y1="185" x2="430" y2="185" />
    <line x1="55" y1="240" x2="430" y2="240" />
    <line x1="55" y1="295" x2="430" y2="295" />
    <line x1="120" y1="110" x2="120" y2="335" />
    <line x1="370" y1="110" x2="370" y2="335" />
  </g>

  <!--  Axes Labels Left Panel  -->
  <line x1="55" y1="108" x2="55" y2="338" stroke="#475569" stroke-width="1.2" marker-start="url(#arrow-slate)" />
  <line x1="55" y1="338" x2="432" y2="338" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)" />
  <text x="24" y="225" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e9bb0" transform="rotate(-90, 24, 225)" text-anchor="middle">
    BUJUR EKLIPTIKA (λ°)
  </text>
  <text x="245" y="356" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8e9bb0" text-anchor="middle">
