  <circle cx="148" cy="255" r="4.5" fill="#0b111e" stroke="#10b981" stroke-width="2" />
  <text x="142" y="283" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#10b981" text-anchor="end">
