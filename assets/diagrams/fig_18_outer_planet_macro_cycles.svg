<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="auto" style="background-color: #0a0f1a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!--  Gradients  -->
    <linearGradient id="track1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="track2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="earth-regime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="air-regime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="sync-zone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15" />
    </linearGradient>

    <!--  Arrow Markers  -->
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f0ff" />
    </marker>

    <!--  Glow Filters  -->
    <filter id="glow-rose" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!--  Outer Card Background  -->
  <rect x="4" y="4" width="912" height="412" rx="12" fill="#0a0f1a" stroke="#1e283d" stroke-width="1.5" />

  <!--  Subtle Grid Texture  -->
  <g stroke="#1e283d" stroke-width="1" stroke-dasharray="3,5" opacity="0.65">
    <line x1="80" y1="68" x2="80" y2="395" />
    <line x1="205" y1="68" x2="205" y2="395" />
    <line x1="330" y1="68" x2="330" y2="395" />
    <line x1="455" y1="68" x2="455" y2="395" />
    <line x1="580" y1="68" x2="580" y2="395" />
    <line x1="705" y1="68" x2="705" y2="395" />
    <line x1="830" y1="68" x2="830" y2="395" />
  </g>

  <!--  2020 Macro Convergence Highlight Zone  -->
  <rect x="572" y="68" width="18" height="327" fill="url(#sync-zone)" />
  <line x1="581" y1="68" x2="581" y2="395" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,2" opacity="0.7" />

  <!--  Header Section  -->
  <text x="460" y="31" text-anchor="middle" fill="#d4af37" font-size="13.5" font-weight="700" letter-spacing="0.8">
    SIKLUS MAKRO PLANET LUAR (SATURNUS–PLUTO &amp; JUPITER–SATURNUS) TERHADAP REZIM KRISIS
  </text>
  <text x="460" y="49" text-anchor="middle" fill="#8e9bb0" font-size="10.5" font-family="'JetBrains Mono', monospace">
    KORELASI KONJUNGSI SINODIS, GUNCANGAN LIKUIDITAS, DAN PERGESERAN PARADIGMA EKONOMI (1980–2040)
  </text>
  <line x1="40" y1="62" x2="880" y2="62" stroke="#1e283d" stroke-width="1" />

  <!--  =========================================================================  -->
  <!--  TRACK 1: SATURNUS-PLUTO (TOP)                                              -->
  <!--  =========================================================================  -->
  
  <!--  Track 1 Title Banner  -->
  <rect x="40" y="72" width="535" height="22" rx="4" fill="#171324" stroke="#f43f5e" stroke-width="0.8" stroke-opacity="0.6" />
  <circle cx="53" cy="83" r="4" fill="#f43f5e" />
  <text x="65" y="87" fill="#f3e5ab" font-size="10.5" font-weight="700" letter-spacing="0.5">
    SIKLUS SATURNUS–PLUTO (~33–38 TAHUN): PENGETATAN &amp; KRISIS SISTEMIK
  </text>

  <!--  Track 1 Sinusoidal Cycle Wave  -->
  <!--  1982 (x=105, Peak) -> 2001 (x=342.5, Trough) -> 2020 (x=580, Peak) -> 2037.5 (x=798, Trough)  -->
  <path d="M 70 155 C 80 152, 92 140, 105 140 C 185 140, 262 194, 342.5 194 C 423 194, 500 140, 580 140 C 660 140, 735 194, 798 194 C 825 194, 845 182, 865 170" 
        fill="none" stroke="url(#track1-grad)" stroke-width="2.2" stroke-dasharray="4,2" opacity="0.75" />

  <!--  Track 1 Main Axis Line  -->
  <line x1="50" y1="167" x2="875" y2="167" stroke="url(#track1-grad)" stroke-width="3" marker-end="url(#arrow-rose)" />

  <!--  EVENT 1.1: 1982 Conjunction (x = 105)  -->
  <line x1="105" y1="140" x2="105" y2="167" stroke="#f43f5e" stroke-width="1.5" />
  <circle cx="105" cy="167" r="6.5" fill="#0a0f1a" stroke="#f43f5e" stroke-width="2.5" filter="url(#glow-rose)" />
  <circle cx="105" cy="167" r="2.5" fill="#f3e5ab" />
  
  <!--  Callout Box 1982 (Above Track 1)  -->
  <rect x="45" y="100" width="235" height="50" rx="5" fill="#111827" fill-opacity="0.92" stroke="#f43f5e" stroke-width="1" />
  <text x="55" y="115" fill="#f43f5e" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">
    NOV 1982 CONJUNCTION (27° LIBRA)
  </text>
  <text x="55" y="130" fill="#e2e8f0" font-size="10.5" font-weight="600">
    Krisis Stagflasi Volcker &amp; Resesi Global
  </text>
  <text x="55" y="143" fill="#8e9bb0" font-size="9.5">
    Suku bunga The Fed ~20% &amp; krisis utang LatAm
  </text>

  <!--  EVENT 1.2: 2001 Opposition (x = 342.5)  -->
  <line x1="342.5" y1="167" x2="342.5" y2="180" stroke="#d4af37" stroke-width="1.5" />
  <polygon points="342.5,159 350.5,167 342.5,175 334.5,167" fill="#0a0f1a" stroke="#d4af37" stroke-width="2.2" />
  <circle cx="342.5" cy="167" r="2" fill="#f3e5ab" />

  <!--  Callout Box 2001 (Below Track 1)  -->
  <rect x="232" y="180" width="222" height="44" rx="5" fill="#111827" fill-opacity="0.92" stroke="#d4af37" stroke-width="1" />
  <text x="343" y="195" text-anchor="middle" fill="#f3e5ab" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">
    2001–2002 OPPOSITION (180° GEM–SAG)
  </text>
  <text x="343" y="209" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-weight="600">
    Guncangan 9/11 &amp; Dot-Com Crash
  </text>
  <text x="343" y="220" text-anchor="middle" fill="#8e9bb0" font-size="9">
    Kontraksi valuasi ekuitas &amp; sekuritisasi global
  </text>

  <!--  EVENT 1.3: Jan 2020 Conjunction (x = 580)  -->
  <line x1="580" y1="140" x2="580" y2="167" stroke="#f43f5e" stroke-width="2" />
  <circle cx="580" cy="167" r="7.5" fill="#0a0f1a" stroke="#f43f5e" stroke-width="3" filter="url(#glow-rose)" />
  <circle cx="580" cy="167" r="3" fill="#f3e5ab" />

  <!--  Callout Box Jan 2020 (Above Track 1)  -->
  <rect x="462" y="96" width="286" height="54" rx="5" fill="#1a1121" fill-opacity="0.95" stroke="#f43f5e" stroke-width="1.3" />
  <text x="472" y="111" fill="#f43f5e" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">
    JAN 2020 CONJUNCTION (22° CAPRICORN)
  </text>
  <text x="472" y="126" fill="#e2e8f0" font-size="10.5" font-weight="700">
    Guncangan Pandemi &amp; Supply Shock
  </text>
  <text x="472" y="141" fill="#f3e5ab" font-size="9.5">
    Lockdown global, QE ekstrem &amp; ledakan utang negara
  </text>

  <!--  EVENT 1.4: 2035-2036 Opposition Projection (x = 775)  -->
  <polygon points="775,161 781,167 775,173 769,167" fill="#0a0f1a" stroke="#8e9bb0" stroke-width="1.5" />
  <text x="775" y="206" text-anchor="middle" fill="#8e9bb0" font-size="9.5" font-family="'JetBrains Mono', monospace">
    ~2036 OPPOSITION
  </text>
  <text x="775" y="218" text-anchor="middle" fill="#8e9bb0" font-size="9">
    (Ujian Fiskal / Demografi)
  </text>

  <!--  =========================================================================  -->
  <!--  CENTER SHARED TIMELINE AXIS (1980 - 2040)                                  -->
  <!--  =========================================================================  -->
  <rect x="40" y="232" width="840" height="22" rx="4" fill="#0d1526" stroke="#1e283d" stroke-width="1" />
  
  <!--  Decade Markers (1980 to 2040, step = 125px per 10 yrs)  -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8e9bb0" text-anchor="middle">
    <text x="80" y="247">1980</text>
    <text x="205" y="247">1990</text>
    <text x="330" y="247">2000</text>
    <text x="455" y="247">2010</text>
    <text x="580" y="247" fill="#f3e5ab">2020</text>
    <text x="705" y="247">2030</text>
    <text x="830" y="247">2040</text>
  </g>

  <!--  Intermediate 5-year Ticks  -->
  <g stroke="#8e9bb0" stroke-width="1" opacity="0.4">
    <line x1="142.5" y1="238" x2="142.5" y2="248" />
    <line x1="267.5" y1="238" x2="267.5" y2="248" />
    <line x1="392.5" y1="238" x2="392.5" y2="248" />
    <line x1="517.5" y1="238" x2="517.5" y2="248" />
    <line x1="642.5" y1="238" x2="642.5" y2="248" />
    <line x1="767.5" y1="238" x2="767.5" y2="248" />
  </g>

  <!--  2020 Convergence Badge  -->
  <rect x="598" y="234" width="92" height="18" rx="3" fill="#d4af37" fill-opacity="0.18" stroke="#d4af37" stroke-width="0.8" />
  <text x="644" y="246" text-anchor="middle" fill="#f3e5ab" font-size="8.5" font-weight="700" font-family="'JetBrains Mono', monospace">
    TITIK BALIK 2020
  </text>

  <!--  =========================================================================  -->
  <!--  TRACK 2: JUPITER-SATURNUS (BOTTOM)                                         -->
  <!--  =========================================================================  -->

  <!--  Track 2 Title Banner  -->
  <rect x="40" y="262" width="510" height="22" rx="4" fill="#0c212e" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6" />
  <circle cx="53" cy="273" r="4" fill="#00f0ff" />
  <text x="65" y="277" fill="#00f0ff" font-size="10.5" font-weight="700" letter-spacing="0.5">
    SIKLUS JUPITER–SATURNUS (19.86 TAHUN): GREAT MUTATION EKONOMI
  </text>

  <!--  Regime Shaded Band 1: 1980-2020 Earth Dominant / Transition  -->
  <rect x="80" y="294" width="504" height="36" rx="3" fill="url(#earth-regime)" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3,3" />
  <text x="92" y="307" fill="#10b981" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', monospace">
    REZIM ELEMEN TANAH (EARTH SIGNS / AKHIR SIKLUS 200 TAHUN)
  </text>

  <!--  Regime Shaded Band 2: 2020-2040+ Air Dominant (Great Mutation)  -->
  <rect x="588" y="294" width="282" height="36" rx="3" fill="url(#air-regime)" stroke="#00f0ff" stroke-width="1" />
  <text x="600" y="307" fill="#00f0ff" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', monospace">
    GREAT MUTATION: ELEMEN UDARA (AIR SIGNS)
  </text>

  <!--  Track 2 Main Axis Line  -->
  <line x1="50" y1="330" x2="875" y2="330" stroke="url(#track2-grad)" stroke-width="3" marker-end="url(#arrow-cyan)" />

  <!--  20-Year Harmonic Arcs  -->
  <path d="M 90 330 Q 212 292, 335 330" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
  <path d="M 335 330 Q 460 292, 588 330" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
  <path d="M 588 330 Q 712 292, 838 330" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="4,2" opacity="0.9" />

  <!--  Nodes on Track 2  -->
  <!--  1980-1981 Triple Conjunction (x = 90)  -->
  <circle cx="90" cy="330" r="6" fill="#0a0f1a" stroke="#10b981" stroke-width="2.5" />
  <circle cx="90" cy="330" r="2" fill="#e2e8f0" />

  <!--  May 2000 Conjunction in Taurus (x = 335)  -->
  <circle cx="335" cy="330" r="6" fill="#0a0f1a" stroke="#10b981" stroke-width="2.5" />
  <circle cx="335" cy="330" r="2" fill="#e2e8f0" />

  <!--  Dec 2020 Conjunction in 0° Aquarius (x = 588)  -->
  <line x1="588" y1="330" x2="588" y2="342" stroke="#00f0ff" stroke-width="2" />
  <circle cx="588" cy="330" r="7.5" fill="#0a0f1a" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)" />
  <circle cx="588" cy="330" r="3" fill="#f3e5ab" />

  <!--  Oct 2040 Conjunction in Libra (x = 838)  -->
  <circle cx="838" cy="330" r="6" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2" stroke-dasharray="2,1" />
  <text x="838" y="320" text-anchor="middle" fill="#00f0ff" font-size="9" font-family="'JetBrains Mono', monospace">
    2040 (LIBRA)
  </text>

  <!--  Callout Box 2.1: 1980-2000 Earth Regime  -->
  <rect x="65" y="343" width="380" height="56" rx="5" fill="#111827" fill-opacity="0.92" stroke="#10b981" stroke-width="1" />
  <text x="77" y="359" fill="#10b981" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">
    1980–2000 (EARTH SIGNS — PUNCAK MEI 2000 DI 22° TAURUS)
  </text>
  <text x="77" y="374" fill="#e2e8f0" font-size="10.5" font-weight="700">
    Era Ekspansi Manufaktur &amp; Korporasi Tradisional
  </text>
  <text x="77" y="389" fill="#8e9bb0" font-size="9.5">
    Globalisasi rantai pasok fisik, aset riil, komoditas &amp; industrialisasi
  </text>

  <!--  Callout Box 2.2: Dec 2020 Air Regime  -->
  <rect x="475" y="343" width="405" height="56" rx="5" fill="#0c192c" fill-opacity="0.95" stroke="#00f0ff" stroke-width="1.3" />
  <text x="487" y="359" fill="#00f0ff" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">
    DEC 2020 CONJUNCTION (0° AQUARIUS — AIR SIGN MUTATION)
  </text>
  <text x="487" y="374" fill="#e2e8f0" font-size="10.5" font-weight="700">
    Era Ekonomi Digital, AI, DeFi &amp; Kripto
  </text>
  <text x="487" y="389" fill="#f3e5ab" font-size="9.5">
    Dematerialisasi nilai, komputasi awan, jaringan terdesentralisasi &amp; tokenisasi
  </text>

  <!--  Legend / Right Top Indicator  -->
  <g transform="translate(600, 72)">
    <rect x="0" y="0" width="280" height="20" rx="4" fill="#111827" stroke="#1e283d" stroke-width="1" />
    <circle cx="14" cy="10" r="3.5" fill="#0a0f1a" stroke="#f43f5e" stroke-width="2" />
    <text x="23" y="13.5" fill="#8e9bb0" font-size="9" font-family="'JetBrains Mono', monospace">0° Konjungsi</text>
    <polygon points="105,6 109,10 105,14 101,10" fill="#0a0f1a" stroke="#d4af37" stroke-width="1.5" />
    <text x="114" y="13.5" fill="#8e9bb0" font-size="9" font-family="'JetBrains Mono', monospace">180° Oposisi</text>
    <circle cx="195" cy="10" r="3.5" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2" />
    <text x="204" y="13.5" fill="#8e9bb0" font-size="9" font-family="'JetBrains Mono', monospace">Mutasi Elemen</text>
  </g>
</svg>