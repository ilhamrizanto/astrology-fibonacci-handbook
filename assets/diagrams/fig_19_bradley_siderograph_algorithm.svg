<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="auto" style="background:transparent; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>

    <linearGradient id="tentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.0" />
    </linearGradient>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff" />
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8e9bb0" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4af37" />
    </marker>
  </defs>

  <!--  Main Canvas Background  -->
  <rect x="4" y="4" width="912" height="452" rx="10" fill="url(#bgGrad)" stroke="#1e283d" stroke-width="1.5" />

  <!--  Top Header Bar  -->
  <rect x="24" y="18" width="872" height="36" rx="6" fill="#11192c" stroke="#1e283d" stroke-width="1" />
  <circle cx="42" cy="36" r="4.5" fill="#d4af37" />
  <text x="56" y="41" fill="#f3e5ab" font-size="13.5" font-weight="700" letter-spacing="0.8">DEKONSTRUKSI ALGORITMA BRADLEY SIDEROGRAPH &amp; FUNGSI ORB TENT</text>
  <text x="880" y="40" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="end">MODEL: DONALD BRADLEY (1948)</text>

  <!--  =========================================================================  -->
  <!--  TOP-LEFT PANEL: TENT FUNCTION (x=24..446, y=66..292)                       -->
  <!--  =========================================================================  -->
  <rect x="24" y="66" width="422" height="226" rx="8" fill="#0d1526" stroke="#1e283d" stroke-width="1.2" />
  <text x="40" y="88" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.5">1. FUNGSI PEMBOBOTAN ORB SEGITIGA (TENT FUNCTION)</text>

  <!--  Formula Pill inside Top-Left Panel  -->
  <rect x="40" y="98" width="390" height="28" rx="4" fill="#080c17" stroke="#1c2a44" stroke-width="1" />
  <text x="235" y="116" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11.2" text-anchor="middle" font-weight="600">
    w(Δθ) = max(0, 1 - |Δθ - θ_aspect| / Orb_max)
  </text>

  <!--  Subtle Grid Lines for Tent Graph  -->
  <line x1="65" y1="148" x2="365" y2="148" stroke="#1e283d" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="215" y1="138" x2="215" y2="225" stroke="#1e283d" stroke-width="1" stroke-dasharray="3,3" />

  <!--  Axes for Tent Graph  -->
  <!--  Y-Axis  -->
  <line x1="65" y1="228" x2="65" y2="136" stroke="#8e9bb0" stroke-width="1.2" marker-end="url(#arrowSlate)" />
  <text x="58" y="152" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">1.0</text>
  <text x="58" y="189" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="end">0.5</text>
  <text x="58" y="225" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">0.0</text>
  <text x="40" y="138" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">w(Δθ)</text>

  <!--  X-Axis  -->
  <line x1="60" y1="225" x2="380" y2="225" stroke="#8e9bb0" stroke-width="1.2" marker-end="url(#arrowSlate)" />

  <!--  Tent Polygon Fill & Crisp Stroke  -->
  <polygon points="105,225 215,148 325,225" fill="url(#tentFill)" />
  <polyline points="75,225 105,225 215,148 325,225 360,225" fill="none" stroke="#00f0ff" stroke-width="2.4" />

  <!--  Key Nodes on Tent Graph  -->
  <!--  Left Cutoff (-15 deg)  -->
  <circle cx="105" cy="225" r="3.5" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2" />
  <text x="105" y="240" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">-15°</text>
  <text x="105" y="251" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">(-Orb_max)</text>

  <!--  Peak Exact (0 deg)  -->
  <circle cx="215" cy="148" r="4.5" fill="#d4af37" stroke="#f3e5ab" stroke-width="1.5" />
  <text x="215" y="140" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">EXACT (w = 1.0)</text>
  <text x="215" y="240" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">0° (θ_aspect)</text>

  <!--  Right Cutoff (+15 deg)  -->
  <circle cx="325" cy="225" r="3.5" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2" />
  <text x="325" y="240" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">+15°</text>
  <text x="325" y="251" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">(+Orb_max)</text>

  <!--  Linear Slope Annotations  -->
  <text x="148" y="180" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" transform="rotate(-35 148 180)">Linear Decay</text>
  <text x="282" y="180" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" transform="rotate(35 282 180)">Linear Decay</text>

  <!--  Valence Badges at Bottom of Panel 1  -->
  <rect x="40" y="260" width="188" height="22" rx="4" fill="#09221c" stroke="#10b981" stroke-width="0.9" />
  <text x="134" y="274" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Valensi V = +1 (60°, 120°)</text>

  <rect x="242" y="260" width="188" height="22" rx="4" fill="#28101a" stroke="#f43f5e" stroke-width="0.9" />
  <text x="336" y="274" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Valensi V = -1 (90°, 180°)</text>

  <!--  =========================================================================  -->
  <!--  BOTTOM-LEFT PANEL: MASTER EQUATION (x=24..446, y=304..440)                 -->
  <!--  =========================================================================  -->
  <rect x="24" y="304" width="422" height="136" rx="8" fill="#0d1526" stroke="#1e283d" stroke-width="1.2" />
  <text x="40" y="325" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.5">2. PERSAMAAN AGREGASI SIDEROGRAPH S(t)</text>

  <!--  Master Equation Box  -->
  <rect x="40" y="334" width="390" height="32" rx="5" fill="#141c2e" stroke="#d4af37" stroke-width="1.2" />
  <text x="235" y="355" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">
    S(t) = M · [ P(t) + D(t) ] + L(t)
  </text>

  <!--  Component Breakdown Grid (2x2)  -->
  <!--  P(t)  -->
  <rect x="40" y="374" width="190" height="26" rx="4" fill="#09101d" stroke="#1e283d" stroke-width="1" />
  <text x="48" y="391" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">P(t):</text>
  <text x="84" y="391" fill="#e2e8f0" font-size="10">Aspek Planet Tengah &amp; Dalam</text>

  <!--  D(t)  -->
  <rect x="240" y="374" width="190" height="26" rx="4" fill="#09101d" stroke="#1e283d" stroke-width="1" />
  <text x="248" y="391" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">D(t):</text>
  <text x="284" y="391" fill="#e2e8f0" font-size="10">Faktor Deklinasi (δ sin/cos)</text>

  <!--  L(t)  -->
  <rect x="40" y="406" width="190" height="26" rx="4" fill="#09101d" stroke="#1e283d" stroke-width="1" />
  <text x="48" y="423" fill="#d4af37" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">L(t):</text>
  <text x="84" y="423" fill="#e2e8f0" font-size="10">Siklus Long-Term (Outer)</text>

  <!--  M  -->
  <rect x="240" y="406" width="190" height="26" rx="4" fill="#09101d" stroke="#1e283d" stroke-width="1" />
  <text x="248" y="423" fill="#d4af37" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">M   :</text>
  <text x="284" y="423" fill="#e2e8f0" font-size="10">Multiplier Skala Empiris</text>


  <!--  =========================================================================  -->
  <!--  RIGHT PANEL: SIDEROGRAPH CURVE & POLARITY INVERSION (x=462..896, y=66..440) -->
  <!--  =========================================================================  -->
  <rect x="462" y="66" width="434" height="374" rx="8" fill="#0d1526" stroke="#1e283d" stroke-width="1.2" />
  <text x="478" y="88" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.5">3. KURVA SIDEROGRAPH S(t) vs PRINSIP POLARITY INVERSION</text>
  <text x="478" y="104" fill="#8e9bb0" font-size="10">Siderograph mengidentifikasi <tspan fill="#f3e5ab" font-weight="600">jendela waktu pembalikan (turning dates)</tspan>, bukan arah mutlak.</text>

  <!--  Vertical Time Alignment Guides (T1, T2, T3)  -->
  <!--  T1 = x:570, T2 = x:685, T3 = x:800  -->
  <line x1="570" y1="125" x2="570" y2="395" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.75" />
  <line x1="685" y1="125" x2="685" y2="395" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.75" />
  <line x1="800" y1="125" x2="800" y2="395" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.75" />

  <!--  =========================================================================  -->
  <!--  SUB-PANEL 3A: BRADLEY SIDEROGRAPH S(t) (y=115..235)                        -->
  <!--  =========================================================================  -->
  <rect x="478" y="114" width="402" height="122" rx="6" fill="#080d18" stroke="#192338" stroke-width="1" />
  <text x="490" y="130" fill="#d4af37" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">OUTPUT ALGORITMA: KURVA S(t)</text>
  <text x="868" y="130" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="end">Titik Ekstrem: dS/dt ≈ 0</text>

  <!--  Baseline S(t)  -->
  <line x1="490" y1="185" x2="868" y2="185" stroke="#1e283d" stroke-width="1" />

  <!--  S(t) Area Fill & Curve  -->
  <!--  T1(570,145) Peak, T2(685,220) Trough, T3(800,148) Peak  -->
  <path d="M 495,205 C 525,205 545,145 570,145 C 605,145 650,220 685,220 C 720,220 765,148 800,148 C 825,148 845,190 865,198 L 865,230 L 495,230 Z" fill="url(#goldFill)" />
  <path d="M 495,205 C 525,205 545,145 570,145 C 605,145 650,220 685,220 C 720,220 765,148 800,148 C 825,148 845,190 865,198" fill="none" stroke="#d4af37" stroke-width="2.5" />

  <!--  Turning Point Nodes on S(t)  -->
  <circle cx="570" cy="145" r="4.5" fill="#0a0f1a" stroke="#f3e5ab" stroke-width="2" />
  <text x="570" y="136" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">MAX (T₁)</text>

  <circle cx="685" cy="220" r="4.5" fill="#0a0f1a" stroke="#00f0ff" stroke-width="2" />
  <text x="685" y="209" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">MIN (T₂)</text>

  <circle cx="800" cy="148" r="4.5" fill="#0a0f1a" stroke="#f3e5ab" stroke-width="2" />
  <text x="800" y="139" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">MAX (T₃)</text>


  <!--  =========================================================================  -->
  <!--  SUB-PANEL 3B: MARKET REALIZATION & POLARITY INVERSION (y=246..395)         -->
  <!--  =========================================================================  -->
  <rect x="478" y="246" width="402" height="150" rx="6" fill="#080d18" stroke="#192338" stroke-width="1" />
  
  <!--  Legend Header inside Sub-Panel 3B  -->
  <text x="490" y="263" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">RESPON HARGA PASAR P(t):</text>
  
  <!--  In-Phase Legend  -->
  <line x1="635" y1="259" x2="653" y2="259" stroke="#10b981" stroke-width="2.2" />
  <text x="658" y="263" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">In-Phase (+1)</text>

  <!--  Inverted Legend  -->
  <line x1="748" y1="259" x2="768" y2="259" stroke="#f43f5e" stroke-width="2.2" stroke-dasharray="4,2" />
  <text x="773" y="263" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">Inverted (-1)</text>

  <!--  Neutral Equilibrium Line  -->
  <line x1="490" y1="330" x2="868" y2="330" stroke="#1e283d" stroke-width="1" />

  <!--  CURVE 1: IN-PHASE MARKET (Emerald Green - Tracks S(t) directly)  -->
  <!--  T1(570,285) High, T2(685,372) Low, T3(800,288) High  -->
  <path d="M 495,352 C 525,352 545,285 570,285 C 605,285 650,372 685,372 C 720,372 765,288 800,288 C 825,288 845,335 865,345" fill="none" stroke="#10b981" stroke-width="2.2" />

  <!--  CURVE 2: INVERTED MARKET (Alert Rose - Polarity Inverted at exact same T1, T2, T3)  -->
  <!--  T1(570,375) Low, T2(685,285) High, T3(800,372) Low  -->
  <path d="M 495,308 C 525,308 545,375 570,375 C 605,375 650,285 685,285 C 720,285 765,372 800,372 C 825,372 845,325 865,315" fill="none" stroke="#f43f5e" stroke-width="2.2" stroke-dasharray="5,3" />

  <!--  T1 Alignment Markers  -->
  <circle cx="570" cy="285" r="3.5" fill="#10b981" />
  <circle cx="570" cy="375" r="3.5" fill="#f43f5e" />
  <text x="563" y="280" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="end">Top</text>
  <text x="563" y="384" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="end">Bottom</text>

  <!--  T2 Alignment Markers (Polarity Inversion Highlight)  -->
  <circle cx="685" cy="372" r="3.5" fill="#10b981" />
  <circle cx="685" cy="285" r="3.5" fill="#f43f5e" />
  <rect x="641" y="319" width="88" height="20" rx="4" fill="#111a2e" stroke="#00f0ff" stroke-width="1" />
  <text x="685" y="332" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">INFLEKSI T₂</text>

  <!--  T3 Alignment Markers  -->
  <circle cx="800" cy="288" r="3.5" fill="#10b981" />
  <circle cx="800" cy="372" r="3.5" fill="#f43f5e" />
  <text x="807" y="283" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="start">Top</text>
  <text x="807" y="382" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="start">Bottom</text>

  <!--  Bottom Time Axis & Invariance Conclusion Box  -->
  <rect x="478" y="402" width="402" height="28" rx="4" fill="#10192d" stroke="#1e283d" stroke-width="1" />
  <text x="570" y="419" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">T₁ (Pivot 1)</text>
  <text x="685" y="419" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">T₂ (Pivot 2)</text>
  <text x="800" y="419" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">T₃ (Pivot 3)</text>
  <text x="488" y="419" fill="#8e9bb0" font-family="'JetBrains Mono', monospace" font-size="9">INVARIANCE:</text>
</svg>