<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background: #0a0f1a; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e283d" stroke-width="0.6" stroke-dasharray="2,2"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-rose" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyan-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="gold-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="65%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="rose-trap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8e9bb0"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4af37"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="912" height="432" rx="10" fill="#0a0f1a" stroke="#1e283d" stroke-width="1.5"/>

  <!-- Main Header -->
  <g text-anchor="middle">
    <text x="460" y="31" fill="#d4af37" font-size="13.5" font-weight="800" letter-spacing="1.2">PERBANDINGAN PARADIGMA: REDUKSIONISME 1D vs EKUILIBRIUM RUANG-WAKTU ASTRONACCI</text>
    <text x="460" y="49" fill="#8e9bb0" font-size="10.5" font-family="'JetBrains Mono', monospace">EVALUASI STRUKTURAL MODEL INDIKATOR LAGGING TERHADAP KONFLUENSI ORTOGONAL (P × T)</text>
    <line x1="60" y1="60" x2="860" y2="60" stroke="#1e283d" stroke-width="1"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT PANEL: PARADIGMA KONVENSIONAL (1D LAGGING) (x = 30..445)              -->
  <!-- ========================================================================= -->
  <g id="left-panel">
    <!-- Panel Container -->
    <rect x="30" y="72" width="415" height="348" rx="8" fill="#0d1424" stroke="#1e283d" stroke-width="1.2"/>
    <rect x="30" y="72" width="415" height="34" rx="8" fill="#131c31"/>
    <!-- Status Indicator & Header -->
    <circle cx="48" cy="89" r="4.5" fill="#f43f5e" filter="url(#glow-rose)"/>
    <text x="62" y="93" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.6">PARADIGMA KONVENSIONAL (1D LAGGING)</text>
    <text x="432" y="93" fill="#f43f5e" font-size="9.5" font-family="'JetBrains Mono', monospace" text-anchor="end">DIMENSI TUNGGAL</text>

    <!-- Plot Grid Area -->
    <rect x="82" y="120" width="340" height="245" fill="url(#grid)"/>

    <!-- Orthogonal Axes -->
    <line x1="82" y1="365" x2="82" y2="118" stroke="#8e9bb0" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <line x1="82" y1="365" x2="428" y2="365" stroke="#8e9bb0" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

    <!-- Y-Axis Label -->
    <text x="52" y="242" fill="#e2e8f0" font-size="10.5" font-weight="600" text-anchor="middle" transform="rotate(-90, 52, 242)">Harga (Y) — Support Statis</text>

    <!-- X-Axis Label & Sub-caption -->
    <text x="255" y="388" fill="#e2e8f0" font-size="10.5" font-weight="600" text-anchor="middle">Waktu Pasif (Linear Δt = konstan)</text>
    <text x="255" y="404" fill="#8e9bb0" font-size="9.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Asumsi reduksionis: waktu diperlakukan homogen tanpa bobot siklus</text>

    <!-- Static Support Level Line -->
    <line x1="82" y1="268" x2="418" y2="268" stroke="#8e9bb0" stroke-width="1.2" stroke-dasharray="5,4"/>
    <rect x="88" y="251" width="132" height="15" rx="2" fill="#0d1424" opacity="0.85"/>
    <text x="92" y="262" fill="#8e9bb0" font-size="9" font-family="'JetBrains Mono', monospace">Support Klasik (1D Horizontal)</text>

    <!-- Red Trap Zone: False Breakout / Early Entry -->
    <rect x="195" y="242" width="85" height="96" rx="4" fill="url(#rose-trap)" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Price Action Path (1D) -->
    <path d="M 92 148 L 118 160 L 138 152 L 165 205 L 195 268 L 218 248 L 242 260 L 268 322 L 298 338 L 325 325 L 358 345 L 398 336" 
          fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Key Candlesticks -->
    <!-- Early Drop -->
    <line x1="165" y1="190" x2="165" y2="220" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="161" y="195" width="8" height="20" fill="#f43f5e"/>
    <!-- Support Touch & Bullish Trap Bounce -->
    <line x1="195" y1="255" x2="195" y2="276" stroke="#10b981" stroke-width="1.2"/>
    <rect x="191" y="260" width="8" height="10" fill="#10b981"/>
    <line x1="218" y1="238" x2="218" y2="262" stroke="#10b981" stroke-width="1.2"/>
    <rect x="214" y="244" width="8" height="14" fill="#10b981"/>
    <!-- Breakdown / Stop-Loss Hunt -->
    <line x1="242" y1="252" x2="242" y2="285" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="238" y="256" width="8" height="24" fill="#f43f5e"/>
    <line x1="268" y1="280" x2="268" y2="332" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="264" y="284" width="8" height="40" fill="#f43f5e"/>
    <line x1="298" y1="318" x2="298" y2="345" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="294" y="322" width="8" height="18" fill="#f43f5e"/>

    <!-- Lagging Moving Average Curve (Trailing Behind Drop) -->
    <path d="M 92 135 C 145 135, 185 162, 235 208 C 280 250, 335 305, 405 318" 
          fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6,3"/>

    <!-- Lag Phase Shift Δφ Callout -->
    <line x1="175" y1="218" x2="244" y2="218" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-gold)"/>
    <rect x="184" y="199" width="54" height="15" rx="3" fill="#0d1424" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="211" y="210" fill="#f3e5ab" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Lag Δφ</text>

    <!-- Moving Average Label Box -->
    <rect x="265" y="142" width="150" height="36" rx="4" fill="#131c31" stroke="#f59e0b" stroke-width="1"/>
    <text x="340" y="156" fill="#f3e5ab" font-size="9.5" font-weight="700" text-anchor="middle">Kurva Moving Average</text>
    <text x="340" y="170" fill="#8e9bb0" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Reaktif &amp; Tertinggal (Lagging)</text>
    <line x1="315" y1="178" x2="282" y2="246" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="282" cy="246" r="3" fill="#f59e0b"/>

    <!-- False Breakout / Lagging Entry Annotation -->
    <rect x="92" y="294" width="174" height="58" rx="5" fill="#1a111e" stroke="#f43f5e" stroke-width="1.3" filter="url(#glow-rose)"/>
    <text x="179" y="310" fill="#f43f5e" font-size="9.5" font-weight="800" text-anchor="middle">FALSE BREAKOUT / LAGGING ENTRY</text>
    <text x="179" y="324" fill="#e2e8f0" font-size="8.5" text-anchor="middle">Beli prematur di support statis</text>
    <text x="179" y="337" fill="#8e9bb0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">sebelum siklus waktu (T) selesai!</text>

    <!-- Pointer from Trap Box to Premature Buy Point -->
    <path d="M 205 294 L 216 256" fill="none" stroke="#f43f5e" stroke-width="1.4" marker-end="url(#arrow-rose)"/>
    <circle cx="218" cy="248" r="4" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER DIVIDER BADGE                                                      -->
  <!-- ========================================================================= -->
  <line x1="460" y1="80" x2="460" y2="412" stroke="#1e283d" stroke-width="1.2" stroke-dasharray="4,4"/>
  <circle cx="460" cy="246" r="14" fill="#131c31" stroke="#d4af37" stroke-width="1.2"/>
  <text x="460" y="250" fill="#d4af37" font-size="9.5" font-weight="800" font-family="'JetBrains Mono', monospace" text-anchor="middle">VS</text>

  <!-- ========================================================================= -->
  <!-- RIGHT PANEL: PARADIGMA ASTRONACCI (2D TIME-SPACE CONFLUENCE) (x=475..890) -->
  <!-- ========================================================================= -->
  <g id="right-panel">
    <!-- Panel Container -->
    <rect x="475" y="72" width="415" height="348" rx="8" fill="#0d1424" stroke="#1e283d" stroke-width="1.2"/>
    <rect x="475" y="72" width="415" height="34" rx="8" fill="#131c31"/>
    <!-- Status Indicator & Header -->
    <circle cx="493" cy="89" r="4.5" fill="#00f0ff" filter="url(#glow-cyan)"/>
    <text x="507" y="93" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.5">PARADIGMA ASTRONACCI (2D TIME-SPACE CONFLUENCE)</text>

    <!-- Plot Grid Area -->
    <rect x="528" y="120" width="340" height="245" fill="url(#grid)"/>

    <!-- Vertical Cyan Time Window Band (T) -->
    <rect x="698" y="120" width="60" height="245" fill="url(#cyan-band)"/>
    <line x1="698" y1="120" x2="698" y2="365" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="758" y1="120" x2="758" y2="365" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Top Label for Cyan Time Window -->
    <rect x="628" y="124" width="200" height="28" rx="4" fill="#0a192f" stroke="#00f0ff" stroke-width="1"/>
    <text x="728" y="136" fill="#00f0ff" font-size="9" font-weight="700" text-anchor="middle">JENDELA WAKTU KOSMIK (ΔT)</text>
    <text x="728" y="147" fill="#e2e8f0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">Turning Point Siklus Ephemeris</text>

    <!-- Secondary Fibonacci Ratio Reference Lines -->
    <line x1="528" y1="215" x2="868" y2="215" stroke="#1e283d" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="864" y="211" fill="#8e9bb0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">0.382</text>
    <line x1="528" y1="245" x2="868" y2="245" stroke="#1e283d" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="864" y="241" fill="#8e9bb0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="end">0.500</text>

    <!-- Horizontal Gold Band (Golden Pocket 0.618 - 0.650) -->
    <rect x="528" y="274" width="340" height="36" fill="url(#gold-band)"/>
    <line x1="528" y1="274" x2="868" y2="274" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="528" y1="310" x2="868" y2="310" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="5,3"/>

    <!-- Golden Pocket Label (Left of intersection) -->
    <rect x="535" y="279" width="154" height="26" rx="3" fill="#171614" stroke="#d4af37" stroke-width="0.9"/>
    <text x="612" y="290" fill="#f3e5ab" font-size="9" font-weight="700" text-anchor="middle">GOLDEN POCKET AREA</text>
    <text x="612" y="301" fill="#d4af37" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Rasio 0.618 – 0.650 (P)</text>

    <!-- GLOWING PULSING TARGET BOX AT INTERSECTION (CONFLUENCE BOX) -->
    <!-- Outer Pulse Halo -->
    <rect x="692" y="268" width="72" height="48" rx="6" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75"/>
    <!-- Main Glowing Box -->
    <rect x="698" y="274" width="60" height="36" rx="4" fill="#d4af37" fill-opacity="0.25" stroke="#00f0ff" stroke-width="2.2" filter="url(#glow-cyan)"/>
    <!-- Target Reticle & Center Pivot Point -->
    <line x1="728" y1="270" x2="728" y2="314" stroke="#f3e5ab" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="694" y1="292" x2="762" y2="292" stroke="#f3e5ab" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Harmonic Price Trajectory into Confluence Box -->
    <path d="M 540 155 L 570 142 L 602 188 L 626 174 L 664 235 L 686 224 L 728 292" 
          fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Exact Reversal Pivot Arrow Upward -->
    <path d="M 728 292 L 758 232 L 776 242 L 822 152" 
          fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-cyan)" marker-end="url(#arrow-emerald)"/>

    <!-- Pivot Singularity Node -->
    <circle cx="728" cy="292" r="5.5" fill="#00f0ff" stroke="#ffffff" stroke-width="1.8" filter="url(#glow-cyan)"/>

    <!-- Reversal Tag -->
    <rect x="772" y="182" width="90" height="28" rx="4" fill="#0b2420" stroke="#10b981" stroke-width="1"/>
    <text x="817" y="194" fill="#10b981" font-size="8.5" font-weight="800" text-anchor="middle">EXACT PIVOT</text>
    <text x="817" y="205" fill="#e2e8f0" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">Zero-Lag Entry</text>

    <!-- CONFLUENCE BOX Callout Badge (Bottom-Right of Intersection) -->
    <rect x="652" y="320" width="208" height="38" rx="5" fill="#111a2e" stroke="#d4af37" stroke-width="1.5" filter="url(#glow-gold)"/>
    <text x="756" y="335" fill="#f3e5ab" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.4">CONFLUENCE BOX (E = P · T = k)</text>
    <text x="756" y="349" fill="#00f0ff" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Ekuilibrium Ruang-Waktu Terkunci</text>
    <line x1="728" y1="310" x2="728" y2="320" stroke="#d4af37" stroke-width="1.5"/>

    <!-- Orthogonal Axes (Drawn cleanly over bands) -->
    <line x1="528" y1="365" x2="528" y2="118" stroke="#d4af37" stroke-width="1.6" marker-end="url(#arrow-gold)"/>
    <line x1="528" y1="365" x2="874" y2="365" stroke="#00f0ff" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>

    <!-- Vertical Axis Label -->
    <text x="498" y="242" fill="#f3e5ab" font-size="10.5" font-weight="600" text-anchor="middle" transform="rotate(-90, 498, 242)">Ruang Fraktal (Rasio Fibonacci / P)</text>

    <!-- Horizontal Axis Label & Sub-caption -->
    <text x="700" y="388" fill="#00f0ff" font-size="10.5" font-weight="600" text-anchor="middle">Waktu Kosmik (Siklus Ephemeris / T)</text>
    <text x="700" y="404" fill="#8e9bb0" font-size="9.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Sinergi ortogonal: harga memantul presisi saat klaster P &amp; T bertemu</text>
  </g>
</svg>