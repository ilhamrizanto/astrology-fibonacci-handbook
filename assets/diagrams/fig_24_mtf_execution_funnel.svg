    <circle cx="396" cy="58" r="4" fill="#00f0ff" />
    <text x="406" y="55" fill="#e2e8f0" font-size="10.5" font-weight="600">Volume Climax</text>
    <text x="406" y="67" fill="#8e9bb0" font-size="9" font-family="'JetBrains Mono', monospace">Absorpsi Smart Money</text>

