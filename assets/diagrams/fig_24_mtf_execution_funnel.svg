    <polygon points="44,78 106,78 90,108 60,108" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1" />
    <polygon points="60,112 90,112 82,142 68,142" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1.2" />

