    <text x="231" y="55" fill="#e2e8f0" font-size="10.5" font-weight="600">Change of Character</text>
    <text x="231" y="67" fill="#8e9bb0" font-size="9" font-family="'JetBrains Mono', monospace">Patah Struktur (ChoCH)</text>

    <text x="368" y="63" fill="#00f0ff" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="700">+</text>

    <!--  Pill 3  -->
