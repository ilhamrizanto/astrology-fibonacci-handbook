<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!--  Background Gradient  -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#080c15" />
    </linearGradient>

    <!--  Tier Card Gradients  -->
    <linearGradient id="card-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1814" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#161b28" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="card-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1d2a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#161b28" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="card-emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b211d" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#111726" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#161b28" stop-opacity="0.95" />
    </linearGradient>

    <!--  Funnel Backdrop Gradient  -->
    <linearGradient id="funnel-mesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.07" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.09" />
    </linearGradient>

    <!--  Glow Filters  -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!--  Arrowhead Markers  -->
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4af37" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>

    <!--  Subtle Grid Pattern  -->
