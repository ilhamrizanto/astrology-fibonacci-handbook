<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="auto" style="background-color: #0a0f1a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4af37" />
    </marker>
    <marker id="spiral-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#10b981" />
    </marker>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11192c" />
      <stop offset="100%" stop-color="#0c1220" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>

  <!-- Main Outer Frame -->
  <rect x="4" y="4" width="912" height="492" rx="10" fill="#0a0f1a" stroke="#1e283d" stroke-width="1.5" />

  <!-- Top Header Banner -->
  <g transform="translate(28, 30)">
    <circle cx="8" cy="-5" r="4" fill="#d4af37" />
    <text x="22" y="0" fill="#f3e5ab" font-size="14.5" font-weight="700" letter-spacing="1.2">KALKULATOR MASTER W.D. GANN: MATRIKS SPIRAL SQUARE OF NINE (1–49)</text>
    <line x1="0" y1="12" x2="864" y2="12" stroke="#1e283d" stroke-width="1" />
  </g>

  <!-- ======================================================================= -->
  <!-- LEFT/CENTER SECTION: 7x7 GANN SQUARE OF NINE (Center = 270, 265)        -->
  <!-- Grid Cell Size = 52x52 px | Total Grid = 364x364 px (x: 88..452, y: 83..447) -->
  <!-- ======================================================================= -->

  <!-- Concentric Ring Subtle Highlights -->
  <rect x="88" y="83" width="364" height="364" rx="4" fill="#0d1424" stroke="#1e283d" stroke-width="1.5" />
  <rect x="140" y="135" width="260" height="260" fill="#0f182a" stroke="#1e283d" stroke-width="1" />
  <rect x="192" y="187" width="156" height="156" fill="#121d33" stroke="#25324d" stroke-width="1" />

  <!-- Underlying Axes (Cardinal & Ordinal Crosses) -->
  <g opacity="0.65">
    <!-- Cardinal Cross (0°, 90°, 180°, 270°) - Glowing Cyan -->
    <line x1="270" y1="458" x2="270" y2="66" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3,3" filter="url(#glow-cyan)" marker-end="url(#arrow-cyan)" />
    <line x1="77" y1="265" x2="469" y2="265" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3,3" filter="url(#glow-cyan)" marker-end="url(#arrow-cyan)" />
    <line x1="270" y1="265" x2="72" y2="265" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3,3" filter="url(#glow-cyan)" marker-end="url(#arrow-cyan)" />
    <line x1="270" y1="265" x2="270" y2="463" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3,3" filter="url(#glow-cyan)" marker-end="url(#arrow-cyan)" />

    <!-- Ordinal / Diagonal Cross (45°, 135°, 225°, 315°) - Dashed Gold -->
    <line x1="80" y1="75" x2="462" y2="457" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-gold)" />
    <line x1="460" y1="75" x2="78" y2="457" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="5,4" />
  </g>

  <!-- Spiral Path Trajectory (1 -> 2 -> 3 ... -> 10) in Subtle Emerald -->
  <path d="M 270 265 L 218 265 L 218 213 L 270 213 L 322 213 L 322 265 L 322 317 L 270 317 L 218 317 L 166 317 L 166 248" 
        fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#spiral-arrow)" />

  <!-- 7x7 Grid Lines -->
  <g stroke="#1e283d" stroke-width="1">
    <!-- Vertical Lines -->
    <line x1="140" y1="83" x2="140" y2="447" />
    <line x1="192" y1="83" x2="192" y2="447" />
    <line x1="244" y1="83" x2="244" y2="447" />
    <line x1="296" y1="83" x2="296" y2="447" />
    <line x1="348" y1="83" x2="348" y2="447" />
    <line x1="400" y1="83" x2="400" y2="447" />
    <!-- Horizontal Lines -->
    <line x1="88" y1="135" x2="452" y2="135" />
    <line x1="88" y1="187" x2="452" y2="187" />
    <line x1="88" y1="239" x2="452" y2="239" />
    <line x1="88" y1="291" x2="452" y2="291" />
    <line x1="88" y1="343" x2="452" y2="343" />
    <line x1="88" y1="395" x2="452" y2="395" />
  </g>

  <!-- Special Cell Highlights: Cardinal Cross Cells -->
  <g fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1">
    <!-- West (180°): 2, 11, 28 -->
    <rect x="196" y="243" width="44" height="44" rx="4" />
    <rect x="144" y="243" width="44" height="44" rx="4" />
    <rect x="92" y="243" width="44" height="44" rx="4" />
    <!-- North (90°): 4, 15, 34 -->
    <rect x="248" y="191" width="44" height="44" rx="4" />
    <rect x="248" y="139" width="44" height="44" rx="4" />
    <rect x="248" y="87" width="44" height="44" rx="4" />
    <!-- East (0°/360°): 6, 19, 40 -->
    <rect x="300" y="243" width="44" height="44" rx="4" />
    <rect x="352" y="243" width="44" height="44" rx="4" />
    <rect x="404" y="243" width="44" height="44" rx="4" />
    <!-- South (270°): 8, 23, 46 -->
    <rect x="248" y="295" width="44" height="44" rx="4" />
    <rect x="248" y="347" width="44" height="44" rx="4" />
    <rect x="248" y="399" width="44" height="44" rx="4" />
  </g>

  <!-- Special Cell Highlights: Even Squares (Top-Left Diagonal: 4-corner=3, 13, 31 & Bottom-Right Odd Squares: 9, 25, 49) -->
  <!-- Odd Squares (9, 25, 49) - Highlighted in Gold -->
  <g fill="#d4af37" fill-opacity="0.16" stroke="#d4af37" stroke-width="1.8" filter="url(#glow-gold)">
    <rect x="196" y="295" width="44" height="44" rx="6" /> <!-- 9 (3²) -->
    <rect x="144" y="347" width="44" height="44" rx="6" /> <!-- 25 (5²) -->
    <rect x="92" y="399" width="44" height="44" rx="6" />  <!-- 49 (7²) -->
  </g>
  <!-- Other Ordinal Diagonal Cells (3, 13, 31 | 5, 17, 37 | 7, 21, 43) -->
  <g fill="#d4af37" fill-opacity="0.05" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2,2">
    <!-- NW (135°): 3, 13, 31 -->
    <rect x="196" y="191" width="44" height="44" rx="4" />
    <rect x="144" y="139" width="44" height="44" rx="4" />
    <rect x="92" y="87" width="44" height="44" rx="4" />
    <!-- NE (45°): 5, 17, 37 -->
    <rect x="300" y="191" width="44" height="44" rx="4" />
    <rect x="352" y="139" width="44" height="44" rx="4" />
    <rect x="404" y="87" width="44" height="44" rx="4" />
    <!-- SE (315°): 7, 21, 43 -->
    <rect x="300" y="295" width="44" height="44" rx="4" />
    <rect x="352" y="347" width="44" height="44" rx="4" />
    <rect x="404" y="399" width="44" height="44" rx="4" />
  </g>

  <!-- Center Apex Cell: Number 1 -->
  <circle cx="270" cy="265" r="21" fill="url(#gold-grad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-gold)" />

  <!-- ======================================================================= -->
  <!-- MATRIX NUMBERS (1 to 49) - JetBrains Mono                               -->
  <!-- Row Y-coords (baseline +5px): 114, 166, 218, 270, 322, 374, 426         -->
  <!-- Col X-coords: 114, 166, 218, 270, 322, 374, 426                         -->
  <!-- ======================================================================= -->
  <g font-family="'JetBrains Mono', monospace" font-size="13.5" text-anchor="middle" font-weight="500" fill="#8e9bb0">
    <!-- ROW 0 (Top: y=114): 31, 32, 33, 34, 35, 36, 37 -->
    <text x="114" y="114" fill="#f3e5ab" font-weight="600">31</text>
    <text x="166" y="114">32</text>
    <text x="218" y="114">33</text>
    <text x="270" y="114" fill="#00f0ff" font-weight="700">34</text>
    <text x="322" y="114">35</text>
    <text x="374" y="114" fill="#e2e8f0">36</text>
    <text x="426" y="114" fill="#f3e5ab" font-weight="600">37</text>

    <!-- ROW 1 (y=166): 30, 13, 14, 15, 16, 17, 38 -->
    <text x="114" y="166">30</text>
    <text x="166" y="166" fill="#f3e5ab" font-weight="600">13</text>
    <text x="218" y="166">14</text>
    <text x="270" y="166" fill="#00f0ff" font-weight="700">15</text>
    <text x="322" y="166" fill="#e2e8f0">16</text>
    <text x="374" y="166" fill="#f3e5ab" font-weight="600">17</text>
    <text x="426" y="166">38</text>

    <!-- ROW 2 (y=218): 29, 12, 3, 4, 5, 18, 39 -->
    <text x="114" y="218">29</text>
    <text x="166" y="218">12</text>
    <text x="218" y="218" fill="#f3e5ab" font-weight="600">3</text>
    <text x="270" y="218" fill="#00f0ff" font-weight="700">4</text>
    <text x="322" y="218" fill="#f3e5ab" font-weight="600">5</text>
    <text x="374" y="218">18</text>
    <text x="426" y="218">39</text>

    <!-- ROW 3 (Center: y=270): 28, 11, 2, 1, 6, 19, 40 -->
    <text x="114" y="270" fill="#00f0ff" font-weight="700">28</text>
    <text x="166" y="270" fill="#00f0ff" font-weight="700">11</text>
    <text x="218" y="270" fill="#00f0ff" font-weight="700">2</text>
    <text x="270" y="270" fill="#0a0f1a" font-size="15.5" font-weight="800">1</text>
    <text x="322" y="270" fill="#00f0ff" font-weight="700">6</text>
    <text x="374" y="270" fill="#00f0ff" font-weight="700">19</text>
    <text x="426" y="270" fill="#00f0ff" font-weight="700">40</text>

    <!-- ROW 4 (y=322): 27, 10, 9, 8, 7, 20, 41 -->
    <text x="114" y="322">27</text>
    <text x="166" y="322" fill="#10b981" font-weight="700">10</text>
    <text x="218" y="322" fill="#f3e5ab" font-size="14.5" font-weight="800">9</text>
    <text x="270" y="322" fill="#00f0ff" font-weight="700">8</text>
    <text x="322" y="322" fill="#f3e5ab" font-weight="600">7</text>
    <text x="374" y="322">20</text>
    <text x="426" y="322">41</text>

    <!-- ROW 5 (y=374): 26, 25, 24, 23, 22, 21, 42 -->
    <text x="114" y="374" fill="#10b981" font-weight="700">26</text>
    <text x="166" y="374" fill="#f3e5ab" font-size="14.5" font-weight="800">25</text>
    <text x="218" y="374">24</text>
    <text x="270" y="374" fill="#00f0ff" font-weight="700">23</text>
    <text x="322" y="374">22</text>
    <text x="374" y="374" fill="#f3e5ab" font-weight="600">21</text>
    <text x="426" y="374">42</text>

    <!-- ROW 6 (Bottom: y=426): 49, 48, 47, 46, 45, 44, 43 -->
    <text x="114" y="426" fill="#f3e5ab" font-size="14.5" font-weight="800">49</text>
    <text x="166" y="426">48</text>
    <text x="218" y="426">47</text>
    <text x="270" y="426" fill="#00f0ff" font-weight="700">46</text>
    <text x="322" y="426">45</text>
    <text x="374" y="426">44</text>
    <text x="426" y="426" fill="#f3e5ab" font-weight="600">43</text>
  </g>

  <!-- Corner Odd Square Badges (3², 5², 7²) -->
  <g font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#0a0f1a">
    <rect x="197" y="296" width="16" height="11" rx="2" fill="#d4af37" />
    <text x="205" y="304" text-anchor="middle">3²</text>

    <rect x="145" y="348" width="16" height="11" rx="2" fill="#d4af37" />
    <text x="153" y="356" text-anchor="middle">5²</text>

    <rect x="93" y="400" width="16" height="11" rx="2" fill="#d4af37" />
    <text x="101" y="408" text-anchor="middle">7²</text>
  </g>

  <!-- Perimeter Angular Degree Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">
    <!-- Cardinal Angles (Cyan) -->
    <text x="270" y="59" fill="#00f0ff" text-anchor="middle">90° (N)</text>
    <text x="476" y="269" fill="#00f0ff" text-anchor="start">0°/360°</text>
    <text x="270" y="479" fill="#00f0ff" text-anchor="middle">270° (S)</text>
    <text x="64" y="269" fill="#00f0ff" text-anchor="end">180°</text>

    <!-- Ordinal Angles (Gold) -->
    <text x="72" y="71" fill="#d4af37" text-anchor="end">135°</text>
    <text x="466" y="71" fill="#d4af37" text-anchor="start">45°</text>
    <text x="466" y="468" fill="#d4af37" text-anchor="start">315°</text>
    <text x="75" y="468" fill="#f3e5ab" text-anchor="end">225° (n²)</text>
  </g>

  <!-- ======================================================================= -->
  <!-- RIGHT INFO PANEL (x = 536 .. 892)                                       -->
  <!-- ======================================================================= -->

  <!-- CARD 1: HUKUM TRANSFORMASI SUDUT KE HARGA -->
  <g transform="translate(536, 58)">
    <rect x="0" y="0" width="356" height="128" rx="8" fill="url(#card-grad)" stroke="#1e283d" stroke-width="1.5" />
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 348 0 A 8 8 0 0 1 356 8 L 356 28 L 0 28 Z" fill="#162038" />
    <circle cx="14" cy="14" r="3.5" fill="#00f0ff" />
    <text x="26" y="18" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.8">HUKUM TRANSFORMASI SUDUT KE HARGA</text>

    <!-- Formula Box -->
    <rect x="16" y="38" width="324" height="44" rx="6" fill="#080c15" stroke="#d4af37" stroke-opacity="0.6" stroke-width="1" />
    <text x="178" y="65" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="700" text-anchor="middle">
      P<tspan font-size="10" dy="4">target</tspan><tspan dy="-4"> = (</tspan><tspan fill="#00f0ff">√P</tspan><tspan fill="#00f0ff" font-size="10" dy="4">0</tspan><tspan dy="-4"> ± Δθ / 180°)</tspan><tspan font-size="10" dy="-6">2</tspan>
    </text>

    <!-- Legend / Sub-details -->
    <text x="18" y="100" fill="#8e9bb0" font-size="10.5">
      • <tspan fill="#e2e8f0" font-family="'JetBrains Mono', monospace">Δθ = 180°</tspan> → <tspan fill="#00f0ff">√P₀ ± 1</tspan> (Setengah Siklus / Opposisi)
    </text>
    <text x="18" y="116" fill="#8e9bb0" font-size="10.5">
      • <tspan fill="#e2e8f0" font-family="'JetBrains Mono', monospace">Δθ = 360°</tspan> → <tspan fill="#d4af37">√P₀ ± 2</tspan> (1 Cincin Penuh / +1 Ring)
    </text>
  </g>

  <!-- CARD 2: SUDUT KARDINAL & HARMONIK -->
  <g transform="translate(536, 200)">
    <rect x="0" y="0" width="356" height="142" rx="8" fill="url(#card-grad)" stroke="#1e283d" stroke-width="1.5" />
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 348 0 A 8 8 0 0 1 356 8 L 356 28 L 0 28 Z" fill="#162038" />
    <circle cx="14" cy="14" r="3.5" fill="#d4af37" />
    <text x="26" y="18" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.8">SUDUT KARDINAL &amp; HARMONIK</text>

    <!-- Bullet 1: 90 deg -->
    <rect x="16" y="40" width="54" height="22" rx="4" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" />
    <text x="43" y="55" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">90°</text>
    <text x="80" y="50" fill="#e2e8f0" font-size="11" font-weight="600">Square (Kuartal: Δ√P = 0.5)</text>
    <text x="80" y="64" fill="#8e9bb0" font-size="10">Friksi Dinamis / Support-Resistance Kuartal</text>

    <!-- Bullet 2: 180 deg -->
    <rect x="16" y="75" width="54" height="22" rx="4" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="1" />
    <text x="43" y="90" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">180°</text>
    <text x="80" y="85" fill="#e2e8f0" font-size="11" font-weight="600">Opposition (Setengah: Δ√P = 1.0)</text>
    <text x="80" y="99" fill="#8e9bb0" font-size="10">Titik Balik Polaritas Ekstrem &amp; Pivot Utama</text>

    <!-- Bullet 3: 360 deg -->
    <rect x="16" y="110" width="54" height="22" rx="4" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-width="1" />
    <text x="43" y="125" fill="#f3e5ab" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">360°</text>
    <text x="80" y="120" fill="#e2e8f0" font-size="11" font-weight="600">Full Cycle (Siklus Penuh: Δ√P = 2.0)</text>
    <text x="80" y="134" fill="#8e9bb0" font-size="10">Time &amp; Price Squaring (Harmoni Ekuilibrium 1×1)</text>
  </g>

  <!-- CARD 3: KUADRAT GANJIL (ODD SQUARES) & EKUILIBRIUM -->
  <g transform="translate(536, 356)">
    <rect x="0" y="0" width="356" height="122" rx="8" fill="url(#card-grad)" stroke="#1e283d" stroke-width="1.5" />
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 348 0 A 8 8 0 0 1 356 8 L 356 28 L 0 28 Z" fill="#162038" />
    <circle cx="14" cy="14" r="3.5" fill="#10b981" />
    <text x="26" y="18" fill="#e2e8f0" font-size="11.5" font-weight="700" letter-spacing="0.8">EKUILIBRIUM KUADRAT GANJIL (ODD SQUARES)</text>

    <!-- Visual Progression Pills: 1² -> 3² -> 5² -> 7² -->
    <g transform="translate(16, 38)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="58" height="24" rx="4" fill="#1a243b" stroke="#d4af37" stroke-width="1" />
      <text x="29" y="16" fill="#f3e5ab">1² = 1</text>

      <text x="69" y="16" fill="#8e9bb0">→</text>

      <rect x="80" y="0" width="62" height="24" rx="4" fill="#1a243b" stroke="#d4af37" stroke-width="1" />
      <text x="111" y="16" fill="#f3e5ab">3² = 9</text>

      <text x="153" y="16" fill="#8e9bb0">→</text>

      <rect x="164" y="0" width="68" height="24" rx="4" fill="#1a243b" stroke="#d4af37" stroke-width="1" />
      <text x="198" y="16" fill="#f3e5ab">5² = 25</text>

      <text x="243" y="16" fill="#8e9bb0">→</text>

      <rect x="254" y="0" width="70" height="24" rx="4" fill="#d4af37" fill-opacity="0.2" stroke="#d4af37" stroke-width="1.5" />
      <text x="289" y="16" fill="#f3e5ab">7² = 49</text>
    </g>

    <text x="16" y="82" fill="#e2e8f0" font-size="10.5">
      Sudut <tspan fill="#f3e5ab" font-weight="600">225° (Diagonal Barat Daya)</tspan> mengunci deret kuadrat
    </text>
    <text x="16" y="97" fill="#8e9bb0" font-size="10.5">
      ganjil <tspan font-family="'JetBrains Mono', monospace" fill="#e2e8f0">(2n+1)²</tspan> sebagai penutup setiap cincin spiral. Titik
    </text>
    <text x="16" y="112" fill="#8e9bb0" font-size="10.5">
      <tspan fill="#10b981" font-weight="600">n² + 1</tspan> (2, 10, 26) memicu ekspansi volatilitas ke cincin baru.
    </text>
  </g>
</svg>